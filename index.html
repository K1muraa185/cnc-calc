  const last = hs.find(h => h.sym && h.sym.length);
  if (last && hs[0] === last && last.used && last.used.n > 0 && last.used.F > 0) {
    const fx = fixRun(last.used, last.sym, metal, r.z), ch = fixText(fx.k);
    out += `<div class="note w">${ic('alert')}<div>Минулого разу (${fmtDate(last.ts)}, S${fmt(last.used.n)} · F ${fF(last.used.F, mach)}) було: <b>${esc(last.sym.map(s => SYMPTOMS[s]?.n.toLowerCase()).filter(Boolean).join(', '))}</b>.
      <br>Виправлення: ${esc(ch || 'без змін')} — ${esc(last.sym.map(s => SYMPTOMS[s]?.why).filter(Boolean)[0] || '')}.
      <br><button class="btn primary" data-act="useFix" data-id="${last.id}">Перевірити виправлений режим</button></div></div>`;
  }
  const t = DB.tools[tool.id];
  if (t && t.use && t.use.frac >= 0.8) {
    const insT = INS_TYPES.includes(t.type), fin = OPS[r.op]?.fin;
    out += `<div class="note ${t.use.frac >= 1 ? 'b' : 'w'}">${ic(t.use.frac >= 1 ? 'stop' : 'alert')}<div>${insT ? 'Кромка пластин' : 'Фреза'} відпрацювала ~${Math.round(t.use.frac * 100)}% ресурсу${t.use.wear > 0 ? ` (знос по Ø ≈ ${fmt(t.use.wear, 3)} мм)` : ''}.
      ${t.use.frac >= 1 ? (insT ? 'Поверни пластини на нову кромку.' : 'Час міняти або заточувати.') : fin ? 'Для чистової з жорстким допуском краще свіжа.' : 'Скоро міняти.'}
      <br><button class="btn" data-act="editTool" data-id="${t.id}">Відкрити фрезу</button></div></div>`;
  } else if (t && t.use && t.use.wear >= 0.015 && OPS[r.op]?.fin && mat.g === 'metal')
    out += `<div class="note i">${ic('info')}<div>Знос фрези по Ø ≈ ${fmt(t.use.wear, 3)} мм — врахуй у корекції D (у стійці зменш радіус на ${fmt(t.use.wear / 2, 3)} мм або заміряй першу деталь).</div></div>`;
  // виліт не заміряно, а саме він обмежив глибину (в інших випадках вистачає позначки «≈» біля поля)
  if (t && (t.loGuess || !(num(t.lo) > 0)) && OPS[r.op]?.cut && r.limWhy === 'defl')
    out += `<div class="note i">${ic('info')}<div>Глибину за прохід обмежив віджим, а виліт фрези ${t.loGuess ? 'типовий' : 'не вписаний'} — взято ${fmt(r.L, 0)} мм. Заміряй від цанги до кінчика і впиши — режим стане точним, а з коротшим вильотом можна глибше.
      <br><button class="btn" data-act="focusLo">Вписати свій виліт</button></div></div>`;
  return out;
}

    const op = (OPS_BY_TYPE[t.type] || ['contour']).find(o => OPS[o].cut) || 'contour';
    const r = calc(curMachine(), t, mat, op, 'norm', Math.min(5, num(t.lc) || 5), 1, '');

// ======================= Деталі: маршрут обробки, час, вартість =======================
// Деталь = список операцій (кожна — фреза, матеріал, верстат, операція, глибина, ширина + довжина траєкторії або обʼєм зняття).
// Режими перераховуються наживо з поточних даних фрез і верстатів, тож картка завжди актуальна.
const PART_MAX_OPS = 20;
const partSort = () => Object.values(DB.parts).sort((a, b) => (b.ts || 0) - (a.ts || 0));
// Розрахунок однієї операції деталі
function partOpCalc(o) {
  const mach = DB.machines[o.mach], tool = DB.tools[o.tool], mat = getMat(o.mat);
  if (!mach || !tool || !mat) return { error: !tool ? 'фрезу видалено' : !mat ? 'матеріал видалено' : 'верстат видалено' };
  const D = num(tool.d), aePct = num(o.aeMm) > 0 && D > 0 ? String(clamp(num(o.aeMm) / D * 100, 1, 100)) : '';
  const r = calc(mach, tool, mat, o.op, o.mode || 'norm', o.depth, o.engr || 1, aePct, null, { cornerR: o.cornerR, boreD: o.boreD, preD: o.preD });
  if (r.error) return r;
  // час: отвір по спіралі — з власної траєкторії; інше — за довжиною з CAM або за обʼємом зняття і продуктивністю (MRR)
  const min = r.boreMin > 0 && !(num(o.path) > 0) ? r.boreMin : num(o.path) > 0 ? num(o.path) / r.F : num(o.vol) > 0 && r.mrr > 0 ? num(o.vol) / r.mrr : NaN;
  return { ...r, mach, tool, mat, min, how: r.boreMin > 0 || num(o.path) > 0 ? 'path' : num(o.vol) > 0 ? 'vol' : '' };
}
// Підсумок: різання на деталь, зміни інструменту, налагодження, партія, вартість
function partTotals(p) {
  const rows = p.ops.map(partOpCalc);
  let cut = 0, unknown = 0, changes = 0, prev = '';
  rows.forEach((r, i) => {
    if (Number.isFinite(r.min)) cut += r.min; else unknown++;
    const t = p.ops[i].tool; if (t !== prev) { if (prev) changes++; prev = t; }
  });
  // зміна інструменту: на обробному центрі з магазином — ~0,2 хв, на роутері вручну — ~2 хв
  const m0 = rows.find(r => r.mach)?.mach, chMin = m0 && machKind(m0) === 'metal' ? 0.2 : 2;
  const qty = Math.max(1, num(p.qty) || 1), setup = num(p.setup) || 0;
  const perPart = cut + changes * chMin, batch = setup + perPart * qty;
  const rate = num(p.rate) > 0 ? num(p.rate) : num(DB.cfg.rate) || 0;
  return { rows, cut, unknown, changes, chMin, perPart, batch, qty, setup, rate, cost: rate > 0 ? batch / 60 * rate : NaN };
}
const hm = min => { if (!Number.isFinite(min)) return '—'; const t = Math.round(min); return t >= 60 ? `${Math.floor(t / 60)} год ${t % 60} хв` : min < 10 ? `${fmt(min, 1)} хв` : `${t} хв`; };

async function partDone(p) {
  const v = await promptNum(`Скільки деталей «${p.name}» зроблено?`, p.qty || 1);
  if (!(v > 0)) return;
  const qty = Math.round(v);
  const T = partTotals(p); let n = 0, nopath = 0;
  for (let i = 0; i < p.ops.length; i++) {
    const o = p.ops[i], r = T.rows[i]; if (r.error) continue;
    const pathMm = num(o.path) > 0 ? num(o.path) : Number.isFinite(r.min) ? r.min * r.F : 0;
    if (!(pathMm > 0)) { nopath++; continue; }
    await addUse(r.tool, r.mat, pathMm * qty / 1000, pathMm * qty / r.F, Math.PI * r.D * r.n / 1000, (r.vMin + r.vMax) / 2); n++;
  }
  p.done = (p.done || 0) + qty; await savePart(p);
  haptic('success'); toast(`Записано ${qty} шт: ресурс ${n} ${plural(n, 'фрези', 'фрез', 'фрез')} оновлено${nopath ? `, ${nopath} без часу пропущено` : ''}`);
  closeSheet(); partForm(p);
}
// Запит числа простим полем (без системного prompt, який у Telegram виглядає чужо)
function promptNum(title, def) {
  return new Promise(res => {
    openSheet(title, `<form id="pn" autocomplete="off"><label class="f"><span>Кількість</span><input name="v" inputmode="numeric" value="${esc(def)}"></label>

    const obs = new MutationObserver(() => { if (!$('#pn')) { obs.disconnect(); res(0); } });
    obs.observe(sheet, { childList: true });
  });
}

      const nn = n > 0 ? n : D > 0 && vc > 0 ? 1000 * vc / (Math.PI * D) : NaN;
      if (D > 0 && n > 0) out.push(`<p class="rc-big">Vc = π·D·n/1000 = <b>${fmt(Math.PI * D * n / 1000, 1)}</b> м/хв</p>`);
      else if (nn > 0) out.push(`<p class="rc-big">n = 1000·Vc/(π·D) = <b>${fmt(nn)}</b> об/хв</p>`);
      const z = num(v.z), fz = num(v.fz), F = num(v.F);
      if (z > 0 && nn > 0) {
        if (F > 0) out.push(`<p class="rc-big">fz = F/(z·n) = <b>${fmt(F / (z * nn), 4)}</b> мм</p>`);
        else if (fz > 0) out.push(`<p class="rc-big">F = fz·z·n = <b>${fmt(fz * z * nn)}</b> мм/хв (${fmt(fz * z * nn / 60, 1)} мм/с)</p>`);
      }
      return out.join('') || '<p class="rc-n">Заповни поля.</p>';
    } },
  { id: 'thin', t: 'Потоншення стружки (вузьке зняття)', icon: 'contour',
    form: () => `<div class="g3"><label class="f"><span>Ø, мм</span><input name="d" inputmode="decimal" value="10"></label>
      <label class="f"><span>Зняти збоку, мм</span><input name="ae" inputmode="decimal" value="1"></label><label class="f"><span>Стружка, мм</span><input name="h" inputmode="decimal" value="0.03"></label></div>`,
    out: v => {
      const D = num(v.d), ae = num(v.ae), h = num(v.h);
      if (!(D > 0 && ae > 0 && h > 0)) return '<p class="rc-n">Заповни поля.</p>';
      if (ae >= D / 2) return `<p>Зняття ${fmt(ae, 2)} мм ≥ половини Ø — стружка повна, програмуй fz = ${fmt(h, 3)} мм.</p>`;
      const k = 1 / Math.sqrt(1 - Math.pow(1 - 2 * ae / D, 2));
      return `<p class="rc-big">Програмуй fz = <b>${fmt(h * k, 3)}</b> мм (×${fmt(k, 2)})</p>
        <p>При знятті ${fmt(ae / D * 100, 0)}% Ø фактична стружка в ${fmt(k, 2)} раза тонша за подачу на зуб. Без поправки кромка тре і гріється. Апка в розрахунку робить це сама (до ×1,8 на чорновій, ×1,4 на чистовій).</p>`;
    } },
];

function rcUpdate(id) {

// Інвентар цеху (inventory.json поруч з апкою): верстати, пластини, фрези і перевірені режими.
// Додає лише те, чого ще немає; нічого з того, що користувач змінив чи видалив, не чіпає.
async function seedInventory() {
  let inv;
  try { const r = await fetch('inventory.json', { cache: 'no-cache' }); if (!r.ok) return null; inv = await r.json(); } catch (e) { return null; }
  const ver = +inv.ver || 0;
  if (!ver || (+DB.cfg.invVer || 0) >= ver) return null;
  const del = new Set(DB.cfg.invDel || []), n = { m: 0, i: 0, t: 0, h: 0 };
  const add = async (arr, key, target, prefix, norm = x => x) => {
    for (const o0 of arr || []) {
      if (!o0 || !o0.id || target[o0.id] || del.has(o0.id)) continue;
      const o = norm({ ...o0 });
      target[o.id] = o; await Store.set(prefix + o.id, o); n[key]++;
    }
  };
  await add(inv.machines, 'm', DB.machines, 's_', normalizeMachine);
  await add(inv.inserts, 'i', DB.inserts, 'i_');
  await add(inv.tools, 't', DB.tools, 't_', o => ({ ...o, created: o.created || Date.now() }));
  await add(inv.hist, 'h', DB.hist, 'h_');
  // точкові оновлення записів інвентаря — лише якщо користувач їх не змінював (поля з «if» збігаються)
  const TG = { inv_t_: [DB.tools, 't_'], inv_i_: [DB.inserts, 'i_'], inv_m_: [DB.machines, 's_'], inv_h_: [DB.hist, 'h_'] };
  for (const p of inv.patch || []) {
    const pre = Object.keys(TG).find(k => String(p.id).startsWith(k)); if (!pre) continue;
    const [target, key] = TG[pre], o = target[p.id];
    if (!o || !Object.entries(p.if || {}).every(([k, v]) => o[k] === v || num(o[k]) === num(v))) continue;
    Object.assign(o, p.set || {}); await Store.set(key + o.id, o);
  }
  // застарілі записи інвентаря (замінені новими) — прибираємо
  for (const id of inv.retire || []) for (const [target, p] of [[DB.hist, 'h_'], [DB.tools, 't_'], [DB.inserts, 'i_']])
    if (target[id]) { delete target[id]; await Store.del(p + id); }
  // автоматичний верстат «Мій фрезер», якого ніхто не налаштовував, тепер зайвий
  if (n.m) for (const m of Object.values(DB.machines)) if (!m.configured && !String(m.id).startsWith('inv_')) { delete DB.machines[m.id]; await Store.del('s_' + m.id); }
  sortMachines();
  DB.cfg = { ...DB.cfg, invVer: ver, onboarded: DB.cfg.onboarded || n.m > 0 };
  await Store.set('cfg', DB.cfg);
  return n;
}

async function doImport() {
  let d; try { d = JSON.parse($('#imp').value); } catch (e) { return toast('Це не схоже на резервну копію', true); }
  if (!d || d.app !== 'cnc-calc') return toast('Це не резервна копія цієї апки', true);
  const groups = [['tools', 't_', DB.tools, x => x], ['ins', 'i_', DB.inserts, x => x], ['parts', 'd_', DB.parts, x => x], ['mats', 'm_', DB.matOv, normalizeMat], ['machines', 's_', DB.machines, normalizeMachine], ['hist', 'h_', DB.hist, x => x]];
  const total = groups.reduce((s, [k]) => s + Object.keys(d[k] || {}).length, 0);
  if (!total) return toast('У копії немає записів', true);
  if (!(await ask(`Імпортувати ${total} записів?`))) return;
  let done = 0;
  for (const [k, p, target, norm] of groups) for (const o0 of Object.values(d[k] || {})) {
    if (!o0 || !o0.id) continue;
    const o = norm(o0);
    target[o.id] = o; await Store.set(p + o.id, o);
    if (++done % 10 === 0) $('#impst').textContent = `Імпортовано ${done} з ${total}…`;
  }
  await trimHistory();
  haptic('success'); toast(`Імпортовано ${done} записів`); closeSheet(); initState(); render();
}

  if (h.tool === '__manual') { S.toolId = '__manual'; Object.assign(S.manual, { type: h.snap.type, d: String(h.snap.d), z: String(h.snap.z), tm: h.snap.tm || 'carbide', lo: h.snap.lo > 0 ? String(h.snap.lo) : S.manual.lo }); }

  if (h.depth > 0) S.depth = String(h.depth);
  if (h.engr > 0) S.engrDepth = String(h.engr);

  S.aeMm = h.aeMm > 0 ? String(h.aeMm) : h.aePct > 0 && Dh > 0 ? String(rAp(h.aePct * Dh / 100)) : '';

  editTool: el => toolForm(DB.tools[el.dataset.id]),
  photo: () => {
    if (!DB.apiKey) { toast('Спершу додай ключ Claude API в Налаштуваннях', true); return; }
    $('#ph').click();
  },
  dupTool: el => {
    const t = DB.tools[el.dataset.id]; if (!t) return;
    closeSheet(); toolForm({ ...t, id: undefined, name: t.name + ' (копія)', used: 0, lastUsed: 0, created: 0 });
  },
  delTool: async el => {
    const t = DB.tools[el.dataset.id]; if (!t || !(await ask(`Видалити фрезу «${t.name}»? Історія з нею залишиться.`))) return;
    delete DB.tools[t.id]; await Store.del('t_' + t.id); await forget(t.id);
    if (S.toolId === t.id) S.toolId = sortedTools()[0]?.id || '__manual';
    saveCfgSoon(); closeSheet(); render();
  },
  useTool: el => {
    if (!DB.tools[el.dataset.id]) return;
    S.toolId = el.dataset.id; S.useVer = null; S.tab = 'calc'; S.anim = true; saveCfgSoon(); closeSheet(); render(); window.scrollTo(0, 0); haptic('sel');
  },
  toolsSub: el => { if (S.toolsSub === el.dataset.v) return; S.toolsSub = el.dataset.v; render(); haptic('sel'); },
  newIns: () => { closeSheet(); insForm(null); },
  editIns: el => { const i = DB.inserts[el.dataset.id]; if (i) insForm(i); },
  delIns: async el => {
    const i = DB.inserts[el.dataset.id]; if (!i) return;
    const u = insUse(i.id);
    if (!(await ask(`Видалити пластину «${i.code}»?${u.tools.length ? ` Вона стоїть у ${u.tools.length} ${plural(u.tools.length, 'фрезі', 'фрезах', 'фрезах')} — там рахуватиму за типовими даними.` : ''}`))) return;
    delete DB.inserts[i.id]; await Store.del('i_' + i.id); await forget(i.id);
    closeSheet(); render();
  },
  insPhoto: () => {
    if (!DB.apiKey) { toast('Спершу додай ключ Claude API в Налаштуваннях', true); return; }
    $('#ph3').click();
  },
  qtyStep: el => {
    const inp = el.closest('.st').querySelector('input');
    inp.value = Math.max(0, Math.round((num(inp.value) || 0) + +el.dataset.d));
    inp.dispatchEvent(new Event('input', { bubbles: true })); haptic('sel');
  },
  findPhoto: el => {
    if (!DB.apiKey) { toast('Спершу додай ключ Claude API в Налаштуваннях', true); return; }
    const kind = el.dataset.kind;
    pickFile(f => findByPhoto(kind, f));
  },
  findAdd: () => {
    const p = findPend; if (!p) return;
    closeSheet();
    if (p.kind === 'tool') toolForm(p.o);
    else if (p.kind === 'ins') insForm(p.o);
    else machForm(p.o);
  },
  machPhoto: el => {
    if (!DB.apiKey) { toast('Спершу додай ключ Claude API в Налаштуваннях', true); return; }
    const f = el.closest('form');
    pickFile(file => runMachPhoto(file, f));
  },
  newMat: () => { closeSheet(); matForm(null); },
  editMat: el => matForm(getMat(el.dataset.id)),
  copyMat: el => { const m = getMat(el.dataset.id); closeSheet(); matForm(null, m); },
  resetMat: async el => {
    const id = el.dataset.id; if (!(await ask('Повернути довідникові значення?'))) return;
    if (DB.matOv[id]?.hidden) { DB.matOv[id] = { id, hidden: true }; await Store.set('m_' + id, DB.matOv[id]); }
    else { delete DB.matOv[id]; await Store.del('m_' + id); }
    toast('Скинуто'); closeSheet(); render();
  },
  hideMat: async el => {
    const id = el.dataset.id; DB.matOv[id] = { ...(DB.matOv[id] || { id }), hidden: true }; await Store.set('m_' + id, DB.matOv[id]);
    if (S.matId === id) S.matId = allMats()[0]?.id;
    toast('Сховано'); closeSheet(); render();
  },
  unhideMat: async el => {
    const id = el.dataset.id, o = { ...(DB.matOv[id] || { id }) }; delete o.hidden;
    if (id.startsWith('p_') && Object.keys(o).length === 1) { delete DB.matOv[id]; await Store.del('m_' + id); }
    else { DB.matOv[id] = o; await Store.set('m_' + id, o); }
    closeSheet(); render();
  },
  delMat: async el => {
    const m = getMat(el.dataset.id); if (!m || !(await ask(`Видалити матеріал «${m.name}»?`))) return;
    delete DB.matOv[m.id]; await Store.del('m_' + m.id);
    if (S.matId === m.id) S.matId = allMats()[0]?.id;
    closeSheet(); render();
  },
  showHidden: () => { S.showHidden = true; render(); },
  hRate: el => { S.hRate = el.dataset.v; renderHist(); haptic('sel'); },
  editHist: el => histForm(DB.hist[el.dataset.id]),
  rate: el => {
    const f = el.closest('form'), inp = f.elements.rate, v = inp.value === el.dataset.v ? '' : el.dataset.v;
    inp.value = v; f.querySelectorAll('[data-act="rate"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); haptic('sel');
  },
  openHist: el => {
    const h = DB.hist[el.dataset.id]; if (!h) return;
    applyHist(h); S.mode = MODES[h.mode] ? h.mode : 'norm';
    S.useVer = h.id; S.tab = 'calc'; saveCfgSoon(); closeSheet(); render(); window.scrollTo(0, 0);
  },
  delHist: async el => {
    const h = DB.hist[el.dataset.id]; if (!h || !(await ask('Видалити запис історії?'))) return;
    delete DB.hist[h.id]; await Store.del('h_' + h.id); if (S.useVer === h.id) S.useVer = null;
    closeSheet(); render();
  },
  newMach: () => { closeSheet(); tplPicker(null, false); },
  editMach: el => { const m = DB.machines[el.dataset.id]; if (!m) return; closeSheet(); if (m.configured) machForm(m); else tplPicker(m.id, false); },
  pickMach: () => machPicker(),
  chooseMach: el => { if (!DB.machines[el.dataset.id]) return; switchMachine(el.dataset.id); closeSheet(); render(); haptic('sel'); },
  chooseTpl: el => tplPicker(el.dataset.id, false),
  tpl: el => {
    const t = MACHINE_TPL.find(x => x.id === el.dataset.tpl); if (!t) return;
    const target = DB.machines[el.dataset.target];
    const base = t.id === 'blank'
      ? { ...defaultMachine(), ...(target || {}), id: target?.id, name: target?.configured ? target.name : t.name, approx: true }
      : { ...defaultMachine(), ...(target || {}), ...t.m, id: target?.id, name: target?.configured ? target.name : t.name, approx: true, kind: t.id };
    closeSheet(); machForm(base, { welcome: !!el.dataset.welcome });
  },
  machHelp: () => openSheet('Де взяти дані верстата', MACH_HELP),
  plate: () => {
    if (!DB.apiKey) { toast('Спершу додай ключ Claude API в Налаштуваннях', true); return; }
    $('#ph2').click();
  },
  skipWelcome: async () => { await markOnboarded(); closeSheet(); },
  delMach: async el => {
    const m = DB.machines[el.dataset.id]; if (!m || !(await ask(`Видалити верстат «${m.name}»?`))) return;
    delete DB.machines[m.id]; await Store.del('s_' + m.id); await forget(m.id);
    if (S.machineId === m.id) S.machineId = Object.keys(DB.machines)[0];
    saveCfgSoon(); closeSheet(); render();
  },
  saveKey: async () => {
    const k = ($('#apikey').value || '').trim();
    if (!/^sk-ant-/.test(k)) return toast('Ключ має починатися з sk-ant-', true);
    DB.apiKey = k; if (await Store.set('apikey', k)) { haptic('success'); toast('Ключ збережено'); } render();
  },
  delKey: async () => {
    if (!(await ask('Видалити ключ Claude API?'))) return;
    DB.apiKey = ''; await Store.del('apikey'); render();
  },
  export: () => exportData(),
  copyExp: () => copyText($('#exp').value),
  import: () => importData(),
  doImport: () => doImport(),
};
// Хвиля від дотику на кнопках і рядках
const RIPPLE_SEL = '.btn,.spec-row,.opt,.tcard,.row,.msw,.chip,.icon-btn,.tabs-in button,.mode button,.st button,.x,.opc,.qk button,.symsel button';
const NO_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
document.addEventListener('pointerdown', e => {
  const el = e.target.closest(RIPPLE_SEL); if (!el || NO_MOTION) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, s = document.createElement('span');
  s.className = 'ripple'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  el.appendChild(s); setTimeout(() => s.remove(), 650);
}, { passive: true });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  e.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) Promise.resolve(fn(el, e)).catch(err => { console.error(err); toast('Помилка: ' + err.message, true); });
});
function setCalc(k, v, full) {
  if (k === 'lo') setLo(v);
  else if (k.startsWith('m.')) S.manual[k.slice(2)] = v; else S[k] = v;
  if (['toolId', 'matId', 'op', 'machineId', 'm.type', 'm.d', 'm.z', 'aeMm', 'depth', 'engrDepth', 'cornerR', 'boreD', 'preD'].includes(k)) { S.useVer = null; S.mine = null; }
  saveCfgSoon();
  if (full) renderCalc(); else renderResult();
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'tol' || el.id === 'raT') {
    const v = num(el.value), key = el.id === 'tol' ? 'tol' : 'ra', ok = key === 'tol' ? v >= 0.005 && v <= 1 : v >= 0.1 && v <= 25;
    DB.cfg = { ...DB.cfg, [key]: ok ? v : undefined }; Store.set('cfg', DB.cfg);
    toast(ok ? (key === 'tol' ? `Допуск ±${fmt(v, 3)} мм` : `Ціль Ra ${fmt(v, 1)} мкм`) : 'Повернуто типове значення');
  }
  if (el.id === 'rate') { const v = num(el.value); DB.cfg = { ...DB.cfg, rate: v > 0 ? v : undefined }; Store.set('cfg', DB.cfg); toast(v > 0 ? `Ставка ${fmt(v)} грн/год збережена` : 'Ставку прибрано'); }
  { const rc = el.closest && el.closest('[data-rc]'); if (rc && el.tagName === 'SELECT') rcUpdate(rc.dataset.rc); }
  if (el.dataset.calc && el.tagName === 'SELECT') setCalc(el.dataset.calc, el.value, true);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.calc && el.tagName !== 'SELECT') setCalc(el.dataset.calc, el.value, false);
  if (el.dataset.filter === 'tools') { if (S.toolsSub === 'ins') S.qIns = el.value; else S.qTools = el.value; renderToolList(); }
  if (el.id === 'pathLen') { S.pathLen = el.value; renderTime(); }
  if (el.id === 'volCm3') { S.volCm3 = el.value; renderTime(); }
  const rc = el.closest && el.closest('[data-rc]'); if (rc) rcUpdate(rc.dataset.rc);
  if (el.dataset.filter === 'hist') { S.qHist = el.value; renderHistList(); }
  if (el.dataset.filter === 'picker') {
    const q = el.value.trim().toLowerCase();
    sheet.querySelectorAll('.opt').forEach(o => o.classList.toggle('hide', !!q && !o.dataset.s.includes(q)));
    sheet.querySelectorAll('.grp-h').forEach(g => g.classList.toggle('hide', !!q));
  }
});

// ======================= Старт =======================
(async function start() {
  applyTheme();
  if (IN_TG) {
    tg.ready(); tg.expand();
    if (tgv('7.7')) tg.disableVerticalSwipes();
    if (tgv('6.1')) tg.BackButton.onClick(closeSheet);
    tg.onEvent('themeChanged', applyTheme);
    if (tgv('7.0')) { try { tg.SettingsButton.show(); tg.SettingsButton.onClick(() => { S.tab = 'settings'; closeSheet(); render(); }); } catch (e) {} }
  } else if (window.matchMedia) {
    try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch (e) {}
  }
  R3.watch();
  try {
    await loadDB();
    applyTheme();   // оформлення з налаштувань
    // інвентар цеху — до першого показу, щоб екран не блимав порожнім верстатом
    const n = TEST ? null : await seedInventory();
    initState();
    if (n && n.m + n.i + n.t + n.h) {
      // перший запуск з інвентарем: фреза і матеріал під активний верстат
      if (n.t && (n.m || S.toolId === '__manual')) S.toolId = Object.values(DB.tools).find(t => t.mach === S.machineId && t.type !== 'drill')?.id || sortedTools()[0]?.id || '__manual';
      if (n.m && machKind(curMachine()) === 'metal' && getMat(S.matId)?.g !== 'metal') { S.matId = 'p_40x'; S.depth = '10'; }
      saveCfgSoon();
    }
    S.anim = true;
    render();
    if (n && n.m + n.i + n.t + n.h) {
      toast(`Додано з цеху: ${[n.m && `${n.m} ${plural(n.m, "верстат", "верстати", "верстатів")}`, n.t && `${n.t} ${plural(n.t, "фрезу", "фрези", "фрез")}`, n.i && `${n.i} ${plural(n.i, "пластину", "пластини", "пластин")}`, n.h && `${n.h} ${plural(n.h, "режим", "режими", "режимів")}`].filter(Boolean).join(', ')}`);
    }
    const m = curMachine();
    if (!DB.cfg.onboarded && !m.configured && !TEST) tplPicker(m.id, true);
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="card empty">Не вдалося завантажити: ${esc(e.message || e)}</div>`;
  }
  if (TEST) window.__cnc = { calc, PRESET_MATS, getMat, MODES, OPS, interp, toolSVG, insertSVG, endSVG, parseInsCode, insRange, DB, seedInventory, fixRun, lifeShare, isoLimits, partTotals, partOpCalc, RC, edgesOf };
})();
})();
</script>
