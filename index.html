// ======================= Креслення інструмента (SVG) =======================
// Стиль технічного рисунка: контур, вісь штрихпунктиром, розміри. Гвинтові канавки — справжня проєкція гвинтової
// лінії на циліндр (синусоїда), ріжучі кромки й пластини — помаранчеві. Поруч «Вид А» з торця: видно кількість зубів чи пластин.
let svgSeq = 0;
const arrowH = (x, y, dir) => `M${x} ${y}l${dir * 4.5} -2v4z`;
const arrowV = (x, y, dir) => `M${x} ${y}l-2 ${dir * 4.5}h4z`;
const f2 = v => +(+v).toFixed(2);
const P2 = q => `${f2(q[0])} ${f2(q[1])}`;
const plateD = pts => `M${pts.map(P2).join('L')}Z`;
const lineD = pts => (pts.length > 1 ? `M${pts.map(P2).join('L')}` : '');
const TXT = (x, y, s, c = 'var(--text)', a = 'start') =>
  `<text x="${f2(x)}" y="${f2(y)}" text-anchor="${a}" font-family="Geist Mono,monospace" font-size="10" font-weight="700" fill="${c}">${s}</text>`;
// Кукурудза по композиту (алмазна насічка) — дрібна, «2 зуби»; чорнова зі стружколомом по металу — 3+ зуби
const isBurr = t => t.type === 'rough' && ((num(t.z) || 2) <= 2 || num(t.d) < 4);
// Кріплення: хвостовик у цангу, насадна на різьбі (M16 у назві), торцева — на оправці
const toolMount = t => (t.type === 'iface' ? 'arbor' : INS_TYPES.includes(t.type) && (t.mount === 'screw' || /\bM\d{2}\b/i.test(t.name || '')) ? 'screw' : 'shank');
const HELIX_DEF = { flat: 35, ball: 30, taperball: 30, rough: 30, comp: 25, drill: 30 };

// Гвинтові канавки збоку: кромка x = cx + R·sin θ, де θ росте вздовж осі; видно лише передню половину циліндра.
// Канавка (заглиблення) — смуга між кромкою і точкою на gw радіан позаду неї. hand = −1 — праве (up-cut, «\»), +1 — ліве («/»).
function helixFlutes(cx, R, yTop, yBot, z, pitch, hand, gw) {
  let grooves = '', edges = '';
  if (!(pitch > 0) || yBot - yTop < 1 || z < 1) return { grooves, edges };
  const n = Math.min(360, Math.max(30, Math.ceil((yBot - yTop) / 0.6)));
  const wrap = a => { let b = (a + Math.PI) % (2 * Math.PI); if (b < 0) b += 2 * Math.PI; return b - Math.PI; };
  const X = a => cx + hand * R * Math.sin(clamp(wrap(a), -Math.PI / 2, Math.PI / 2));
  for (let k = 0; k < z; k++) {
    const ph = 2 * Math.PI * k / z;
    let A = [], B = [], E = [], pa = null, pb = null;
    const flushG = () => { if (A.length > 1 && gw > 0) grooves += `M${A.map(P2).join('L')}L${B.reverse().map(P2).join('L')}Z`; A = []; B = []; };
    const flushE = () => { edges += lineD(E); E = []; };
    for (let i = 0; i <= n; i++) {
      const y = yBot - (yBot - yTop) * i / n, a = ph + (yBot - y) * 2 * Math.PI / pitch, wa = wrap(a), wb = wrap(a - gw);
      const jumpA = pa !== null && Math.abs(wa - pa) > Math.PI, jumpB = pb !== null && Math.abs(wb - pb) > Math.PI;
      if (jumpA || jumpB) flushG();
      if (jumpA) flushE();
      pa = wa; pb = wb;
      A.push([X(a), y]); B.push([X(a - gw), y]);
      if (Math.cos(wa) > 0.02) E.push([X(a), y]); else flushE();
    }
    flushG(); flushE();
  }
  return { grooves, edges };
}

// креслення (запасний варіант, поки вантажиться 3D або якщо WebGL немає)
function toolDraw(t, size) {
  if (INS_TYPES.includes(t.type)) return insToolSVG(t, size);
  const big = size === 'lg', type = t.type || 'flat';
  const W = big ? 112 : 60, H = 150, cx = big ? 42 : W / 2, top = 8;
  const D = num(t.d) > 0 ? num(t.d) : 6;
  const sh = num(t.shank) > 0 ? num(t.shank) : Math.max(D, 3.175);
  const lc = num(t.lc) > 0 ? num(t.lc) : D * 3;
  const ol0 = num(t.ol) > lc ? num(t.ol) : Math.max(lc + Math.max(22, sh * 3), lc * 1.8);
  // У картках і списках — крупний план робочої частини (хвостовик обірвано), на великому кресленні — вся фреза
  const ol = big ? ol0 : Math.min(ol0, lc + Math.max(1.6 * D, sh * 1.8, lc * 0.45)), cropped = ol < ol0 - 0.5;
  // По висоті — справжні пропорції, по ширині — трохи перебільшено, щоб було видно форму
  const s = Math.min((H - 18) / ol, (big ? 50 : 46) / Math.max(D, sh));
  const sx = Math.min(s * 2.2, (big ? 52 : 46) / Math.max(D, sh));
  const ws = sh * sx, wd = Math.max(D * sx, 2.4), r = wd / 2, ht = ol * s, hc = Math.min(lc * s, ht - 4);
  const y0 = top + ht - hc, y1 = top + ht, L = cx - r, R = cx + r;
  const A = clamp(num(t.angle) || 90, 10, 170), id = 'cp' + (++svgSeq), burr = isBurr(t);
  const z = clamp(Math.round(num(t.z) || 2), 1, 8);
  let neck = 0;
  if (ws > wd + 1 && !['vbit', 'engr', 'taperball', 'surf'].includes(type)) neck = Math.min(6, (ws - wd) * 0.9);

  // 1. Силует різальної частини і кромки на торці
  let body, tipE = '', yH = y1;   // yH — де внизу закінчуються гвинтові канавки
  switch (type) {
    case 'ball': body = `M${L} ${y0}H${R}V${y1 - r}A${r} ${r} 0 0 1 ${L} ${y1 - r}Z`; tipE = `M${R} ${y1 - r}A${r} ${r} 0 0 1 ${cx} ${y1}`; break;
    case 'taperball': { const tb = Math.max(ws, wd); body = `M${cx - tb / 2} ${y0}H${cx + tb / 2}L${R} ${y1 - r}A${r} ${r} 0 0 1 ${L} ${y1 - r}Z`; tipE = `M${R} ${y1 - r}A${r} ${r} 0 0 1 ${cx} ${y1}`; break; }
    case 'vbit': { const hk = Math.min(hc, r / Math.tan(A / 2 * rad)); body = `M${L} ${y0}H${R}V${y1 - hk}L${cx} ${y1}L${L} ${y1 - hk}Z`; tipE = `M${R} ${y1 - hk}L${cx} ${y1}`; break; }
    case 'engr': {
      const tp = Math.max(0.8, (num(t.tip) || 0.2) * sx), hk = Math.min(hc, (r - tp / 2) / Math.tan(A / 2 * rad));
      body = `M${L} ${y0}H${R}V${y1 - hk}L${cx + tp / 2} ${y1}H${cx - tp / 2}L${L} ${y1 - hk}Z`; tipE = `M${R} ${y1 - hk}L${cx + tp / 2} ${y1}`; break;
    }
    case 'drill': {   // вершина 140° у твердосплавних, 118° у HSS; дві губки
      const hp = r / Math.tan((t.tm === 'hss' ? 59 : 70) * rad); yH = y1 - hp;
      body = `M${L} ${y0}H${R}V${yH}L${cx} ${y1}L${L} ${yH}Z`; tipE = `M${R} ${yH}L${cx} ${y1}L${L} ${yH}`; break;
    }
    case 'surf': body = `M${L} ${y0}H${R}V${y1}H${L}Z`; tipE = `M${L + 1} ${y1}H${R - 1}`; break;
    default: {
      const c = Math.min(r * 0.2, 1.3);
      if (burr) {   // кукурудза: «риб'ячий хвіст» на торці
        const v = Math.min(r * 0.55, 3);
        body = `M${L} ${y0}H${R}V${y1 - c}L${cx + r * 0.35} ${y1}L${cx} ${y1 - v}L${cx - r * 0.35} ${y1}L${L} ${y1 - c}Z`;
        tipE = `M${cx + r * 0.35} ${y1}L${cx} ${y1 - v}L${cx - r * 0.35} ${y1}`;
      } else { body = `M${L} ${y0}H${R}V${y1 - c}L${R - c} ${y1}H${L + c}L${L} ${y1 - c}Z`; tipE = `M${L + c} ${y1}H${R - c}`; }
    }
  }

  // 2. Канавки: справжня гвинтова лінія
  const beta = num(t.helixAngle) > 0 ? num(t.helixAngle) : HELIX_DEF[type] || 30;
  const pitch = Math.PI * D / Math.tan(beta * rad) * s;
  const gw = 2 * Math.PI / z * (type === 'drill' ? 0.42 : z <= 2 ? 0.38 : 0.32);
  let grooves = '', edges = '', notches = '', runout = true;
  if (burr) {   // алмазна насічка: праві й ліві гвинтові зубчики перехрещуються
    const p = Math.max(Math.PI * D / Math.tan(55 * rad) * s, 2.5), n = D < 3 ? 5 : 7;
    edges = helixFlutes(cx, r, y0, y1, n, p, 1, 0).edges + helixFlutes(cx, r, y0, y1, n, p, -1, 0).edges;
    runout = false;
  } else if (type === 'vbit' || type === 'engr') {
    grooves = `M${cx - r * 0.15} ${y0}H${cx + r * 0.45}L${cx + r * 0.08} ${y1}Z`;
    edges = `M${cx - r * 0.15} ${y0}L${cx} ${y1 - 0.5}`;
  } else if (type === 'straight' || type === 'surf') {
    for (let k = 0; k < z; k++) {
      const a = 2 * Math.PI * k / z + 0.5; if (Math.cos(a) <= 0.05) continue;
      const x = cx + r * Math.sin(a), xb = cx + r * Math.sin(a - 0.6);
      grooves += `M${f2(xb)} ${y0}H${f2(x)}V${y1}H${f2(xb)}Z`; edges += `M${f2(x)} ${y0}V${y1}`;
    }
  } else if (type === 'comp' || t.helix === 'comp') {   // компресійна: внизу up-cut, вище — down-cut
    const ym = y1 - hc * 0.35;
    const lo = helixFlutes(cx, r, ym, yH, z, pitch, -1, gw), hi = helixFlutes(cx, r, y0, ym, z, pitch, 1, gw);
    grooves = lo.grooves + hi.grooves; edges = lo.edges + hi.edges;
  } else {
    const f = helixFlutes(cx, r, y0, yH, z, pitch, t.helix === 'down' ? 1 : -1, gw);
    grooves = f.grooves; edges = f.edges;
    if (type === 'rough') {   // чорнова: стружколомні виїмки по кромках
      const st = Math.max(2.2, hc / 14);
      for (let y = y0 + st * 0.6; y < yH - st * 0.4; y += st)
        notches += `M${f2(L)} ${f2(y)}l${f2(r * 0.16)} ${f2(st * 0.25)}L${f2(L)} ${f2(y + st * 0.5)}ZM${f2(R)} ${f2(y + st * 0.5)}l${f2(-r * 0.16)} ${f2(st * 0.25)}L${f2(R)} ${f2(y + st)}Z`;
    }
  }
  const runD = runout && hc > 4 ? `M${L} ${y0}Q${cx} ${f2(y0 + Math.min(hc * 0.12, r * 0.7))} ${R} ${y0}` : '';

  // 3. Хвостовик з фаскою, шийка
  const c2 = cropped ? 0 : Math.min(ws * 0.12, 1.6);
  const shankD = `M${cx - ws / 2} ${top + c2}L${cx - ws / 2 + c2} ${top}H${cx + ws / 2 - c2}L${cx + ws / 2} ${top + c2}V${y0 - neck}H${cx - ws / 2}Z`;
  // лінія обриву: хвостовик довший, ніж показано
  const brkD = cropped ? (() => { let d = `M${f2(cx - ws / 2 - 1.5)} ${top}`; for (let i = 1; i <= 6; i++) d += `L${f2(cx - ws / 2 - 1.5 + (ws + 3) * i / 6)} ${f2(top + (i % 2 ? -1.4 : 1.4))}`; return d; })() : '';
  const neckD = neck ? `M${cx - ws / 2} ${y0 - neck}H${cx + ws / 2}L${R} ${y0}H${L}Z` : '';
  const band = big && y0 - neck - top > 30 ? `<path d="M${cx - ws / 2 + 1.5} ${f2(top + 9)}h${f2(ws - 3)}M${cx - ws / 2 + 1.5} ${f2(top + 15)}h${f2(ws - 3)}" stroke="var(--ink)" stroke-width=".5" opacity=".5"/>
    <path d="M${cx - ws / 2 + 2.5} ${f2(top + 12)}h${f2((ws - 5) * 0.55)}" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="1.2 .8" opacity=".35"/>` : '';

  let dims = '';
  if (big) {
    // розмір різальної частини — лише якщо його вписано (інакше на кресленні була б вигадана цифра)
    const xr = Math.max(cx + ws / 2, R) + 10, yd = y1 + 9, hasLc = num(t.lc) > 0;
    dims = `<g fill="var(--muted)" stroke="none">${hasLc ? `<path d="${arrowV(xr, y0, 1)}"/><path d="${arrowV(xr, y1, -1)}"/>` : ''}<path d="${arrowH(L, yd, 1)}"/><path d="${arrowH(R, yd, -1)}"/></g>
      <g stroke="var(--muted)" stroke-width=".7" fill="none"><path d="${hasLc ? `M${R + 1} ${y0}H${xr + 3}M${R + 1} ${y1}H${xr + 3}M${xr} ${y0}V${y1}` : ''}M${L} ${y1 + 1}V${yd + 3}M${R} ${y1 + 1}V${yd + 3}M${L} ${yd}H${R}"/></g>
      ${hasLc ? TXT(xr + 5, (y0 + y1) / 2 + 3.5, fmt(lc, 1)) : ''}${TXT(cx, yd + 13, `Ø${fmt(D, 2)}`, 'var(--accent)', 'middle')}`;
  }
  const viewH = big ? H + 26 : H;
  const sizeAttr = big ? 'class="pv-art tsvg"' : `class="tsvg" width="${size === 'xs' ? 30 : 40}" height="${size === 'xs' ? 42 : 76}"`;
  return `<svg viewBox="0 0 ${W} ${viewH}" ${sizeAttr} aria-hidden="true">
    <clipPath id="${id}"><path d="${body}"/></clipPath>
    <path d="M${cx} ${top - 5}V${f2(y1 + 5)}" stroke="var(--muted)" stroke-width=".6" stroke-dasharray="7 2 1.5 2" fill="none"/>
    <g stroke="var(--ink)" stroke-width="${big ? 1.2 : 1.1}" stroke-linejoin="round">
      <path class="dw" pathLength="1" d="${shankD}" fill="var(--ink)" fill-opacity=".06"/>
      ${neckD ? `<path class="dw" pathLength="1" d="${neckD}" fill="var(--ink)" fill-opacity=".06"/>` : ''}
      <path class="dw" pathLength="1" d="${body}" fill="var(--ink)" fill-opacity=".1"/>
    </g>${band}${brkD ? `<path d="${brkD}" stroke="var(--muted)" stroke-width=".8" fill="none"/>` : ''}
    <g clip-path="url(#${id})">
      ${grooves ? `<path d="${grooves}" fill="var(--ink)" fill-opacity=".24"/>` : ''}
      ${notches ? `<path d="${notches}" fill="var(--field)" stroke="var(--ink)" stroke-width=".5"/>` : ''}
      ${runD ? `<path d="${runD}" stroke="var(--ink)" stroke-width=".6" fill="none" opacity=".7"/>` : ''}
      <path d="${edges}" stroke="var(--accent)" stroke-width="${burr ? 0.7 : big ? 1.3 : 1.15}" fill="none" stroke-linecap="round" ${burr ? 'opacity=".85"' : ''}/>
    </g>
    ${tipE ? `<path d="${tipE}" stroke="var(--accent)" stroke-width="${big ? 1.6 : 1.4}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${dims}
  </svg>`;
}

// Фреза зі змінними пластинами, вигляд збоку: сталевий корпус, кишені під стружку, пластини з гвинтами
function insToolSVG(t, size) {
  const big = size === 'lg', face = t.type === 'iface', mount = toolMount(t);
  const D = num(t.d) > 0 ? num(t.d) : face ? 63 : 16;
  const z = clamp(Math.round(num(t.z) || (face ? 6 : 2)), 1, 30);
  const ins = DB.inserts[t.insertId];
  const W = big ? 112 : 60, cx = big ? 44 : W / 2, sw = big ? 1.2 : 1.1, p = big ? 1.1 : 0.9;
  const plate = (pts, o = 1) => `<path d="${plateD(pts)}" fill="var(--accent)" fill-opacity="${f2(0.82 * o)}" stroke="var(--accent)" stroke-opacity="${o}" stroke-width=".8" stroke-linejoin="round"/>`;
  const screw = (x, y, rr) => rr < 0.7 ? '' : `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(rr)}" fill="var(--field)" stroke="var(--ink)" stroke-width=".6"/><path d="M${f2(x - rr * 0.55)} ${f2(y)}h${f2(rr * 1.1)}M${f2(x)} ${f2(y - rr * 0.55)}v${f2(rr * 1.1)}" stroke="var(--ink)" stroke-width=".5"/>`;
  const brk = (xa, xb, y) => { let d = `M${f2(xa - 2)} ${f2(y)}`; const n = 6, st = (xb - xa + 4) / n; for (let i = 1; i <= n; i++) d += `L${f2(xa - 2 + st * i)} ${f2(y + (i % 2 ? -1.6 : 1.6))}`; return `<path d="${d}" stroke="var(--muted)" stroke-width=".7" fill="none"/>`; };
  let H, shapes = '', over = '', dims = '', y1, L, R, axisTop = 3;
  if (face) {
    // Торцева на оправці: «тарілка» з гніздами під 45°, посадка з пазами під шпонку, оправка йде далі в шпиндель
    const s = (big ? 62 : 52) / D, wd = D * s, hb = 0.36 * D * s;
    const wh = Math.min(wd * 0.62, Math.max(0.5 * D, 30) * s), hh = Math.max(2.5, 0.08 * D * s), wa = Math.min(wh * 0.75, Math.max(0.32 * D, 24) * s), ha = Math.max(5, 0.18 * D * s);
    const top = big ? 24 : 12, yA = top + ha, yb = yA + hh; y1 = yb + hb; L = cx - wd / 2; R = cx + wd / 2;
    H = y1 + (big ? 30 : 14); axisTop = top - 6;
    const tr = wd * 0.42, yk = y1 - hb * 0.5;
    shapes = `<path class="dw" pathLength="1" d="M${f2(cx - wa / 2)} ${top}H${f2(cx + wa / 2)}V${f2(yA)}H${f2(cx - wa / 2)}Z" fill="var(--ink)" fill-opacity=".05"/>
      <path class="dw" pathLength="1" d="M${f2(cx - wh / 2)} ${f2(yA)}H${f2(cx + wh / 2)}V${f2(yb)}H${f2(cx - wh / 2)}Z" fill="var(--ink)" fill-opacity=".08"/>
      <path class="dw" pathLength="1" d="M${f2(cx - tr)} ${f2(yb)}H${f2(cx + tr)}L${f2(R)} ${f2(yk)}V${f2(y1)}H${f2(L)}V${f2(yk)}Z" fill="var(--ink)" fill-opacity=".12"/>`;
    over += brk(cx - wa / 2, cx + wa / 2, top);
    // паз під шпонку на посадці
    over += `<path d="M${f2(cx - wh * 0.08)} ${f2(yA)}v${f2(hh * 0.7)}h${f2(wh * 0.16)}v${f2(-hh * 0.7)}" fill="var(--field)" stroke="var(--ink)" stroke-width=".6"/>`;
    const a = Math.min(hb * 0.5, wd * 0.1), dep = a * 0.95;
    const corner = (sg, o) => {   // кут 45°: ріжуча кромка B→C
      const xR = cx + sg * wd / 2, B = [xR - sg * a, y1 + p], C = [xR + sg * p, y1 - a], n = [-sg * dep * 0.7071, -dep * 0.7071];
      return plate([B, C, [C[0] + n[0], C[1] + n[1]], [B[0] + n[0], B[1] + n[1]]], o);
    };
    // гнізда спереду: кишеня-«ложка» над кожною пластиною; пластина — квадрат, повернутий на 45°
    for (let i = 0; i < z; i++) {
      const th = (i + 0.5) * 2 * Math.PI / z, sn = Math.sin(th), cs = Math.cos(th);
      if (sn <= 0.12 || Math.abs(cs) > 0.86) continue;
      const x = cx + cs * wd / 2, w = Math.max(1.4, a * 1.05 * sn), hgt = a * 0.95;
      over += `<path d="M${f2(x - w * 0.9)} ${f2(y1)}Q${f2(x - w * 1.1)} ${f2(y1 - hb * 0.62)} ${f2(x + w * 0.2)} ${f2(y1 - hb * 0.72)}Q${f2(x + w * 0.7)} ${f2(y1 - hb * 0.4)} ${f2(x + w * 0.55)} ${f2(y1)}Z" fill="var(--field)" stroke="var(--ink)" stroke-width=".55" opacity="${f2(0.5 + 0.5 * sn)}"/>`;
      over += plate([[x - w / 2, y1 + p], [x + w / 2, y1 + p], [x + w / 2, y1 - hgt], [x - w / 2 + w * 0.15, y1 - hgt]], 0.45 + 0.5 * sn);
      if (big) over += screw(x, y1 - hgt * 0.45, Math.min(w * 0.22, 1.4));
    }
    over += corner(1, 1) + corner(-1, 0.55);
    if (big) {
      const yd = y1 + 11;
      dims = `<g fill="var(--muted)"><path d="${arrowH(L, yd, 1)}"/><path d="${arrowH(R, yd, -1)}"/></g>
        <path d="M${L} ${y1 + 2}V${yd + 3}M${R} ${y1 + 2}V${yd + 3}M${L} ${yd}H${R}" stroke="var(--muted)" stroke-width=".7" fill="none"/>
        ${TXT(cx, yd + 13, `Ø${fmt(D, 1)}`, 'var(--accent)', 'middle')}${TXT(cx + wh / 2 + 4, top + 8, `Z${z}`)}${TXT(cx + wh / 2 + 4, top + 20, `${fmt(num(t.kappa) || 45)}°`, 'var(--muted)')}`;
    }
  } else {
    // Кінцева з пластинами: хвостовик (або насадна на різьбі), головка з кишенями, пластини з гвинтами
    const screwHead = mount === 'screw';
    const sh = num(t.shank) > 0 ? num(t.shank) : D, ol0 = num(t.ol) > 0 ? num(t.ol) : screwHead ? 1.5 * D : Math.max(4 * D, 60);
    const ilMm = (ins && num(ins.len)) || 10;
    const hlMm = screwHead ? Math.min(ol0 * 0.62, D * 0.95) : Math.min(ol0 * 0.4, Math.max(1.6 * D, 2.2 * ilMm));
    // у картках — крупний план головки з пластинами, хвостовик обірвано
    const ol = big ? ol0 : Math.min(ol0, hlMm + Math.max(0.9 * D, 10)), cropped = ol < ol0 - 0.5;
    H = big ? 176 : 150;
    const s = Math.min(132 / ol, (big ? 50 : 46) / Math.max(D, sh)), sx = Math.min(s * 2.2, (big ? 52 : 46) / Math.max(D, sh));
    const top = Math.max(8, (H - (big ? 26 : 0) - ol * s) / 2), wd = D * sx, ws = Math.min(sh, D * 1.6) * sx; y1 = top + ol * s; L = cx - wd / 2; R = cx + wd / 2;
    axisTop = top - 5;
    const rb = wd / 2 * 0.93;   // корпус трохи менший за коло пластин
    const hl = hlMm * s, yh = y1 - hl;
    const il = Math.min(ilMm * s * 1.15, hl * 0.5), iw = Math.min(wd * 0.42, 6.35 * sx * 0.9);
    // корпус
    const bodyD = ws < 2 * rb - 0.5
      ? `M${f2(cx - ws / 2)} ${top}H${f2(cx + ws / 2)}V${f2(yh - (2 * rb - ws) / 2)}L${f2(cx + rb)} ${f2(yh)}V${f2(y1)}H${f2(cx - rb)}V${f2(yh)}L${f2(cx - ws / 2)} ${f2(yh - (2 * rb - ws) / 2)}Z`
      : `M${f2(cx - ws / 2)} ${top}H${f2(cx + ws / 2)}V${f2(yh)}H${f2(cx + rb)}V${f2(y1)}H${f2(cx - rb)}V${f2(yh)}H${f2(cx - ws / 2)}Z`;
    shapes = `<path class="dw" pathLength="1" d="${bodyD}" fill="var(--ink)" fill-opacity=".1"/>`;
    if (screwHead) {
      // насадна: шийка оправки з лисками під ключ, різьбове зʼєднання, далі — оправка (обрив)
      over += brk(cx - ws / 2, cx + ws / 2, top);
      const yt = yh - Math.min((yh - top) * 0.35, 9);
      over += `<path d="M${f2(cx - ws / 2)} ${f2(yt)}H${f2(cx + ws / 2)}" stroke="var(--ink)" stroke-width=".7" opacity=".8"/>`;
      over += `<path d="M${f2(cx - ws * 0.28)} ${f2(top + 3)}V${f2(yt - 2)}M${f2(cx + ws * 0.28)} ${f2(top + 3)}V${f2(yt - 2)}" stroke="var(--ink)" stroke-width=".55" opacity=".6"/>`;
      let th = ''; for (let y = yt + 1.2; y < yh - 0.6; y += 1.5) th += `M${f2(cx - ws * 0.32)} ${f2(y)}l${f2(ws * 0.64)} -0.8`;
      over += `<path d="${th}" stroke="var(--ink)" stroke-width=".45" opacity=".55"/>`;
    } else {
      // лазерне маркування на хвостовику і канавка-проточка над головкою; у картці хвостовик обірвано
      if (cropped) over += brk(cx - ws / 2, cx + ws / 2, top);
      const yB = top + (yh - top) * 0.3;
      over += `<path d="M${f2(cx - ws / 2 + 1)} ${f2(yB)}h${f2(ws - 2)}M${f2(cx - ws / 2 + 1)} ${f2(yB + 6)}h${f2(ws - 2)}" stroke="var(--ink)" stroke-width=".45" opacity=".5"/>
        <path d="M${f2(cx - ws / 2 + 2)} ${f2(yB + 3)}h${f2((ws - 4) * 0.6)}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="1.1 .7" opacity=".35"/>`;
      over += `<path d="M${f2(cx - rb)} ${f2(yh)}H${f2(cx + rb)}M${f2(cx - rb)} ${f2(yh + 1.6)}H${f2(cx + rb)}" stroke="var(--ink)" stroke-width=".6" opacity=".7"/>`;
    }
    // Пластини як на кресленні з каталогу: головна — праворуч, лицем до нас, з кишенею-«ложкою» і гвинтом;
    // друга — ліворуч у профіль; третя й далі — між ними, у ракурсі. Точну кількість показує «Вид А».
    const pocket = (xEdge, side, w, op) => {
      const xa = xEdge - side * (w + Math.max(2, wd * 0.2));
      return `<path d="M${f2(xa)} ${f2(y1)}C${f2(xa)} ${f2(y1 - il * 0.9)} ${f2(xEdge - side * w * 0.6)} ${f2(y1 - il * 1.7)} ${f2(xEdge - side * 0.3)} ${f2(y1 - il * 1.85)}V${f2(y1)}Z" fill="var(--field)" stroke="var(--ink)" stroke-width=".75" opacity="${op}"/>`;
    };
    const face1 = (xEdge, side, w, op) => {   // пластина лицем: зовнішня кромка вертикальна, верхня — скошена (паралелограм 85°)
      const xIn = xEdge - side * w;
      return plate([[xEdge, y1 + p], [xEdge, y1 + p - il], [xIn, y1 + p - il + w * 0.28], [xIn, y1 + p]], op)
        + `<path d="M${f2(xEdge)} ${f2(y1 + p - il * 0.96)}V${f2(y1 + p)}" stroke="var(--accent)" stroke-width="${big ? 1.8 : 1.4}"/>`
        + screw((xEdge + xIn) / 2, y1 + p - il * 0.48, Math.max(0.7, w * 0.16) * (big ? 1.15 : 1));
    };
    const iwMain = Math.min(wd * 0.5, Math.max(iw, 6.35 * sx * 0.95));
    over += pocket(cx + rb + p, 1, iwMain, 1) + face1(cx + rb + p, 1, iwMain, 1);
    if (z >= 2) {   // профіль протилежної пластини: тонка смужка, що виступає за корпус
      const th = Math.max(1.4, 3.2 * sx * 0.45), xe = cx - rb - p;
      over += `<path d="M${f2(cx - rb + th * 0.4)} ${f2(y1)}Q${f2(cx - rb + th * 1.6)} ${f2(y1 - il * 1.3)} ${f2(cx - rb)} ${f2(y1 - il * 1.75)}" fill="none" stroke="var(--ink)" stroke-width=".6" opacity=".7"/>`;
      over += plate([[xe, y1 + p], [xe, y1 + p - il * 0.92], [xe + th, y1 + p - il * 0.92 + 0.6], [xe + th, y1 + p]], 0.9);
    }
    for (let k = 2; k < Math.min(z, 6); k++) {   // решта — у ракурсі між ними
      const fr = (k - 1) / (Math.min(z, 6) - 1), xEdge = cx - rb * 0.55 + (2 * rb * 0.55) * fr * 0.7, w = iwMain * 0.42;
      over += pocket(xEdge, 1, w, 0.7) + face1(xEdge, 1, w, 0.62);
    }
    if (big) {
      const xr = Math.max(R, cx + ws / 2) + 9, yd = y1 + 9, ap = ins && num(ins.apMax) > 0 ? num(ins.apMax) : 0;
      dims = `<g fill="var(--muted)"><path d="${arrowH(L, yd, 1)}"/><path d="${arrowH(R, yd, -1)}"/></g>
        <path d="M${L} ${y1 + 2}V${yd + 3}M${R} ${y1 + 2}V${yd + 3}M${L} ${yd}H${R}" stroke="var(--muted)" stroke-width=".7" fill="none"/>
        ${TXT(cx, yd + 13, `Ø${fmt(D, 1)}`, 'var(--accent)', 'middle')}${TXT(xr, y1 - il / 2 + 3, `Z${z}`)}${ap ? TXT(xr, y1 - il / 2 + 15, `ap${fmt(ap, 1)}`, 'var(--muted)') : ''}${screwHead ? TXT(xr, top + 10, 'M16', 'var(--muted)') : ''}`;
    }
  }
  const sizeAttr = big ? 'class="pv-art tsvg"' : `class="tsvg" width="${size === 'xs' ? 30 : 40}" height="${size === 'xs' ? 42 : 76}"`;
  return `<svg viewBox="0 0 ${W} ${f2(H)}" ${sizeAttr} aria-hidden="true">
    <path d="M${cx} ${f2(axisTop)}V${f2(y1 + 5)}" stroke="var(--muted)" stroke-width=".6" stroke-dasharray="7 2 1.5 2" fill="none"/>
    <g stroke="var(--ink)" stroke-width="${sw}" stroke-linejoin="round">${shapes}</g>${over}${dims}</svg>`;
}

// «Вид А» — з торця: зуби з канавками (моноліт), губки й перемичка (свердло), насічка (кукурудза), пластини по колу
function endSVG(t, size) {
  const px = size === 'lg' ? 84 : size === 'xs' ? 24 : 30, c = 22, R = 17, type = t.type || 'flat';
  const insT = INS_TYPES.includes(type), z = clamp(Math.round(num(t.z) || 2), 1, insT ? 30 : 8);
  const pt = (rr, a) => [c + rr * Math.cos(a), c + rr * Math.sin(a)];
  const circ = (q, rr, at = '') => `<circle cx="${f2(q[0])}" cy="${f2(q[1])}" r="${f2(rr)}" ${at}/>`;
  let body = '', cut = '', acc = '', thin = '', mid = '';
  if (insT) {
    const face = type === 'iface', Rb = R * (face ? 0.9 : 0.84), d = 2 * Math.PI / z;
    body = circ([c, c], Rb);
    for (let k = 0; k < z; k++) {
      const a = -Math.PI / 2 + k * d, tv = [-Math.sin(a), Math.cos(a)];
      // кишеня перед пластиною (обрізана по корпусу)
      const gr = Math.min(Rb * 0.36, Math.PI * Rb / z * 0.46);
      cut += circ(pt(Rb * 0.98, a + Math.min(d * 0.26, 0.5)), gr);
      // пластина: ріжучий край — на колі R; торцева — квадратні під 45°, кінцева — паралелограми
      const q = face ? Math.min(R * 0.26, Math.PI * R / z * 0.62) : Math.min(R * 0.46, Math.PI * R / z * 0.8);
      const th = face ? q * 0.85 : Math.max(2.2, q * 0.45);
      const o1 = pt(R, a), i1 = pt(R - q, a);
      const P = [o1, i1, [i1[0] - tv[0] * th, i1[1] - tv[1] * th], [o1[0] - tv[0] * th, o1[1] - tv[1] * th]];
      acc += plateD(P);
      const m = P.reduce((s, v) => [s[0] + v[0] / 4, s[1] + v[1] / 4], [0, 0]);
      if (size === 'lg' || z <= 6) mid += circ(m, Math.max(0.55, th * 0.18), 'fill="var(--field)" stroke="var(--ink)" stroke-width=".4"');
    }
    if (face) {   // посадковий отвір і болт кріплення
      mid += circ([c, c], R * 0.3, 'fill="var(--field)" stroke="var(--ink)" stroke-width=".7"');
      const hx = Array.from({ length: 6 }, (_, i) => pt(R * 0.16, i * Math.PI / 3));
      mid += `<path d="${plateD(hx)}" fill="var(--ink)" fill-opacity=".25" stroke="var(--ink)" stroke-width=".6"/>`;
    } else if (toolMount(t) === 'screw') mid += circ([c, c], R * 0.13, 'fill="var(--field)" stroke="var(--ink)" stroke-width=".6"');
  } else if (type === 'drill') {
    body = circ([c, c], R);
    for (const a of [-Math.PI / 2, Math.PI / 2]) {
      cut += circ(pt(R * 0.62, a + 0.95), R * 0.42);
      acc += lineD([pt(R * 0.16, a + 0.55), pt(R, a)]);            // губка
    }
    acc += lineD([pt(R * 0.16, Math.PI / 2 + 0.55), pt(R * 0.16, -Math.PI / 2 + 0.55)]);   // перемичка
  } else if (isBurr(t)) {
    const n = 26, P = [];
    for (let i = 0; i < n * 2; i++) P.push(pt(i % 2 ? R * 0.86 : R, i * Math.PI / n));

  let Dh = NaN, preD = 0, boreK = 1, boreAe = NaN, boreEq = 1;
  if (op === 'bore') {
    Dh = num(opts.boreD); preD = Math.max(0, num(opts.preD) || 0);
    if (!(Dh > 0)) return { error: 'Вкажи діаметр отвору.' };
    if (Dh <= D * 1.02) return { error: `Отвір Ø${fmt(Dh, 2)} не більший за фрезу Ø${fmt(D, 2)} — по спіралі не вийде. Візьми свердло або фрезу меншого діаметра.` };
    if (preD >= Dh) return { error: `Наявний отвір Ø${fmt(preD, 2)} уже не менший за потрібний Ø${fmt(Dh, 2)}.` };
    boreK = Dh / (Dh - D);
    boreAe = clamp(Dh / 2 - Math.max(preD / 2, (Dh - D) / 2 - D / 2), 0.02 * D, D);
    // увігнута стінка обхоплює фрезу більше, ніж пряма: кут контакту як у внутрішньому куті (Rc = Dh/2, Rt = (Dh−D)/2,
    // Rp = наявний отвір). Без наявного отвору — як паз (по дну спіралі фреза врізається всією шириною).
    if (preD > 0) {
      const Rt = (Dh - D) / 2, r0 = D / 2, Rp = preD / 2;
      const phiB = Math.acos(clamp((Rp * Rp - Rt * Rt - r0 * r0) / (2 * Math.max(Rt, 1e-6) * r0), -1, 1));
      boreEq = (1 - Math.cos(phiB)) / 2;
    } else boreEq = 1;
  }
  // Ширина зняття як частка Ø (з операції або введена)
  let aeFrac = O.ae || 0;
  const aeU = num(aePctIn);
  if (op === 'bore') aeFrac = boreEq;
  else if (O.ae && aeU > 0) aeFrac = clamp(aeU, 0.05, 100) / 100;
  // Чистова й напівчистова в металі: припуск у мм (0,15 / 0,3), а не частка Ø, як по дереву
  else aeFrac = aeDefault(O, mat, D);
  // Пластина: «ap до» з коробки — межа для повного зняття; при вузькому (≤35% Ø) можна майже всю кромку (0,85 довжини)
  const narrow = aeFrac > 0 && aeFrac <= 0.35 && op !== 'face';
  const apBox = insT && insert && num(insert.apMax) > 0 ? num(insert.apMax) : NaN;
  const apEdge = insT && insert && num(insert.len) > 0 ? num(insert.len) * 0.85 : NaN;
  const apIns = apBox > 0 ? (narrow && apEdge > apBox ? apEdge : apBox) : NaN;
  const lc0 = num(tool.lc) > 0 ? num(tool.lc) : NaN;
  const lc = apIns > 0 ? (lc0 > 0 ? Math.min(lc0, apIns) : apIns) : lc0;
  const shank = num(tool.shank) > 0 ? num(tool.shank) : D;
  const metal = mat.g === 'metal';
  const rpmMax = num(mach.rpmMax) > 0 ? num(mach.rpmMax) : 24000;
  const rpmMin = clamp(num(mach.rpmMin) || 0, 0, rpmMax);
  const feedMax = num(mach.feedMax) > 0 ? num(mach.feedMax) : 1e9;
  const feedMaxZ = num(mach.feedMaxZ) > 0 ? num(mach.feedMaxZ) : feedMax;
  const fLim = op === 'drill' ? feedMaxZ : feedMax;
  // що вміє верстат: ЗОР, туман, обдув чи нічого (без явного — центр по металу з ЗОР, роутер без)
  const mCool = machCool(mach), wet = mCool === 'flood' || mCool === 'mist';

  // Робочий діаметр: у гравера залежить від глибини
  let Deff = D, h = NaN;
  if (op === 'engrave') {
    h = num(engrIn);
    if (!(h > 0)) return { error: 'Вкажи глибину гравіювання.' };
    if (tool.type === 'vbit' || tool.type === 'engr') {
      const A = clamp(num(tool.angle) || 90, 5, 175), tip = Math.max(0, num(tool.tip) || 0);
      const dAt = tip + 2 * h * Math.tan(A / 2 * rad);
      if (dAt > D * 1.001) say('w', `На глибині ${fmt(h, 2)} мм канавка (${fmt(dAt, 2)} мм) ширша за гравер Ø${fmt(D, 2)} — зменш глибину або візьми ширший гравер.`);
      Deff = Math.max(0.2, Math.min(D, dAt));
    }
  }
  const depth = op === 'engrave' ? h : num(depthIn);
  if (op !== 'f3d' && !(depth > 0)) return { error: 'Вкажи глибину обробки.' };
  // Сферична фреза ріже не повним Ø: на глибині a робочий діаметр 2·√(a·(D−a)). Оберти рахуємо від нього,
  // а стружка тонша в D/Dр разів — подачу компенсуємо (до ×1,8). Для 3D чистової беремо a ≈ 0,1·D.
  const ball = ['ball', 'taperball'].includes(tool.type) && (op === 'f3d' || op === 'r3d');
  let axK = 1;
  if (ball) {
    const a = op === 'f3d' ? 0.1 * D : Math.min(D / 2, mat.apSlot * (metal && mach.rigid === 'heavy' ? 2.5 : 1) * 0.75 * D * M.ap * RG.ap);
    if (a < D / 2) { Deff = Math.max(0.2, 2 * Math.sqrt(a * (D - a))); axK = Deff / D; }
  }

  // 1. Оберти. Метали: n = 1000·V / (π·D) — межа тут нагрів і знос.
  // Дерево, пластики, піни: як у таблицях Amana/Onsrud — частка від максимуму шпинделя,
  // але не повільніше за V мін (дрібні фрези) і не швидше за жорстку межу V (великі фрези).
  let vMin = mat.vmin * T.v, vMax = mat.vmax * T.v;
  // метал, якому потрібна ЗОР, на верстаті без неї — швидкість різання на 20% нижча
  const dryK = metal && mat.cool && !wet ? 0.8 : 1;
  if (insT) {
    const vr = insRange(insert && insert.vc, Array.isArray(mat.vcIns) && mat.vcIns[1] > 0 ? mat.vcIns : INS_DEF[iso].vc);
    vMin = vr[0]; vMax = vr[1];
    if (insert && Array.isArray(insert.iso) && insert.iso.length && !insert.iso.includes(iso))
      say('w', `Пластина ${insert.code || ''} призначена для груп ${insert.iso.join(', ')}, а «${mat.name}» — група ${iso}. Перевір марку сплаву.`);
    if (!insert) say('i', `Пластину не вибрано — беру типові дані для групи ${iso} (${ISO[iso].n}). Точніше буде, якщо привʼязати пластину з коробки.`);
  }
  // свердло: V ≈ 60% від фрезерної (звірено з цехом: ТС Ø6 у 40Х — 3500 об/хв, 0,068 мм/об)
  if (op === 'drill') { vMin *= 0.6; vMax *= 0.6; }
  vMin *= dryK; vMax *= dryK;
  if (dryK < 1) say('i', `На верстаті «${mach.name || 'цьому'}» немає ЗОР — швидкість різання знижено на 20%, бо фреза гріється. ${mat.id === 'p_alu' ? 'Для алюмінію — туман або спирт/WD-40 на кромку, інакше налипає.' : 'Хоча б сильний обдув.'}`);
  const spindleMode = !metal && op !== 'drill' && !insT;
  const vCap = (num(mat.vcap) > 0 ? num(mat.vcap) : mat.vmax * 3) * T.v;
  let V = vMin + (vMax - vMin) * M.v, nIdeal;
  if (spindleMode) {
    nIdeal = clamp(M.fr * rpmMax, 1000 * vMin / (Math.PI * Deff), 1000 * vCap / (Math.PI * Deff));
    V = Math.PI * Deff * nIdeal / 1000;
  } else nIdeal = 1000 * V / (Math.PI * Deff);
  const toolMax = num(tool.maxRpm) > 0 ? num(tool.maxRpm) : Infinity;
  let nCap = Math.min(rpmMax, toolMax), capWhy = toolMax < rpmMax ? 'фреза' : 'шпиндель';
  if (!isFinite(toolMax) && D >= 30 && nCap > 18000) {
    nCap = 18000; capWhy = 'обмеження для великої фрези';
    say('w', `Фреза Ø${fmt(D, 1)} велика — поки в картці фрези не вписані її максимальні оберти з упаковки, обмежую до 18 000 об/хв.`);
  }
  if (nCap < rpmMin) return { error: `Фреза дозволяє максимум ${fmt(nCap)} об/хв, а шпиндель крутить мінімум ${fmt(rpmMin)}. Цією фрезою на цьому верстаті працювати не можна.` };
  let n0 = clamp(rN(nIdeal), rpmMin, nCap);
  if (fixed && num(fixed.n) > 0) n0 = num(fixed.n);
  if (!fixed && nIdeal > nCap * 1.02) say(metal && nIdeal > nCap * 1.15 ? 'w' : 'i', `Для Ø${fmt(Deff, 2)} мм ідеально ~${fmt(r100(nIdeal))} об/хв — ${capWhy === 'фреза' ? 'фреза дозволяє' : capWhy === 'шпиндель' ? 'шпиндель дає' : 'безпечна межа —'} максимум ${fmt(nCap)}, тому оберти обмежено, а подачу перераховано від ${fmt(nCap)}.`);
  if (fixed && n0 > nCap) say('b', `Збережені оберти ${fmt(n0)} більші за допустимі ${fmt(nCap)} (${capWhy}).`);
  if (fixed && n0 < rpmMin * 0.98) say('b', `Оберти ${fmt(n0)} нижчі за мінімум шпинделя (${fmt(rpmMin)}) — верстат так не крутить.`);
  if (nIdeal < rpmMin * 0.98) {
    const Vr = Math.PI * Deff * n0 / 1000, hot = Vr > (spindleMode ? vCap : vMax) * 1.15;
    say(hot ? (metal ? 'b' : 'w') : 'i', `Матеріалу треба лише ~${fmt(r100(nIdeal))} об/хв, а мінімум шпинделя ${fmt(rpmMin)}. Швидкість різання вийде ${fmt(Vr)} м/хв (норма ${fmt(vMin)}–${fmt(vMax)}).` +
      (hot ? (metal ? ' Фреза швидко перегріється і затупиться: візьми фрезу більшого діаметра з покриттям AlTiN і обовʼязково охолодження.' : ' Візьми фрезу більшого діаметра або стеж за нагрівом.') : ''));
  }

  // 2. Подача на зуб — з діапазону довідника
  // Виліт: з картки фрези; якщо не вписано — типовий (у фрез з пластинами корпус довгий, торцева сидить на короткій оправці)
  const L = num(tool.lo) > 0 ? num(tool.lo) : insT ? (tool.type === 'iface' ? 0.35 * D + 25 : 3 * D + 10) : (lc > 0 ? lc + 0.3 * D + 2 : 3 * D + 2);
  // Довга фреза (L > 6D) — правило FrezyCNC «не більше 1D за прохід»; решту бере на себе модель відгину нижче
  const ld = L / D;
  const ldK = ld > 8 ? 0.55 : ld > 6 ? 0.75 : 1;
  if (ldK < 1 && O.cut) say('i', fixed ? `Довгий виліт (${fmt(ld, 1)}×D) — фрезу легко розгойдати: стеж за вібрацією. Якщо можна, засунь її глибше в цангу.`
    : `Довгий виліт (${fmt(ld, 1)}×D) — глибину за прохід знижено. Якщо можна, засунь фрезу глибше в цангу.`);
  const fzIns = insT ? insRange(insert && insert.fz, INS_DEF[iso].fz) : null;
  // Кут у плані: у торцевої 45° стружка тонша за подачу (h = fz · sin κ) — питома сила трохи більша
  const kap = insT ? (num(tool.kappa) > 0 ? num(tool.kappa) : tool.type === 'iface' ? 45 : 90) : 90;
  // кут спіралі: монолітні — з картки або типовий, пластини — малий осьовий кут, прямі ножі й гравери — 0
  const beta = insT ? (tool.type === 'iface' ? 0 : 8) : ['straight', 'vbit', 'engr', 'surf'].includes(tool.type) ? 0
    : num(tool.helixAngle) > 0 ? num(tool.helixAngle) : (HELIX_DEF[tool.type] || 30);
  const sK = kap > 0 && kap < 90 ? Math.sin(kap * rad) : 1;
  // Свердло в металі: подача на оберт ≈ (0,010…0,016)·D з поправкою на групу ISO; на кромку — половина
  const drillM = op === 'drill' && metal && !insT;
  const Dtab = ball ? D : Deff;
  const fzLo = fzIns ? fzIns[0] : drillM ? 0.005 * D * DRILL_K[iso] * T.fz : interp(mat.fzMin, Dtab) * T.fz;
  const fzHi = fzIns ? fzIns[1] : drillM ? 0.008 * D * DRILL_K[iso] * T.fz : interp(mat.fzMax, Dtab) * T.fz;
  if (!(fzLo > 0) || !(fzHi > 0)) return { error: 'У матеріалу не заповнена таблиця подачі на зуб.' };
  const fzMode = fzLo + (fzHi - fzLo) * M.fz;
  // Чистова пластинами: подача — з нижньої межі паспорта, без «компенсації тонкої стружки» (шорсткість важливіша)
  const insFin = insT && O.fin;
  // «Вирівнювання» ×0,6 — для фрез по дереву; пластини торцюють з повною подачею, а при κ < 90° — ще й з більшою (стружка тонша)
  const opFzK = (insT && op === 'face') || drillM ? 1 : O.fzK, kapK = insT && sK < 1 ? Math.min(1 / sK, 1.4) : 1;
  let fzBase = insFin ? fzLo * RG.fz : Math.min(fzMode * opFzK * RG.fz * kapK, fzHi * Math.max(1, kapK * 0.85));
  // паспорт з коробки — це подача на зуб, яку програмують: поправка на кут у плані не виводить за нього
  const boxFzMax = insT && insert && Array.isArray(insert.fz) && insert.fz[1] > 0 ? insert.fz[1] : NaN;
  if (boxFzMax > 0) fzBase = Math.min(fzBase, boxFzMax);
  if (ball && axK < 1) fzBase *= Math.min(1.8, 1 / axK);
  // Чисте дно: шорсткість задає подача на оберт і радіус при вершині (через биття дно робить одна кромка):
  // Rz = f²/(8·r), Ra ≈ Rz/4. Подачу обмежуємо так, щоб вийшла потрібна Ra (за замовчуванням 1,6).
  const raT = num(DB.cfg.ra) > 0 ? num(DB.cfg.ra) : 1.6;
  const reIns = insT ? (num(insert && insert.re) || num(parseInsCode(insert && insert.code).re) || 0.8) : num(tool.cornerR);
  let raLimited = false;

  // 3. Ширина (ae) і глибина (ap)
  let ae = op === 'engrave' ? Deff : aeFrac > 0 ? aeFrac * D : NaN;
  if (fixed && num(fixed.ae) > 0 && op !== 'engrave') ae = num(fixed.ae);
  const apK = M.ap * RG.ap, apBoost = metal && !insT && mach.rigid === 'heavy' ? 2.5 : 1;
  let apRaw = NaN;
  if (insT && (O.ap === 'apSlot' || O.ap === 'apSide'))   // пластини: від паспортної глибини, далі — перевірка міцності й потужності
    apRaw = (lc > 0 ? lc : Math.min(0.25 * D, 4)) * Math.min(1, O.apK || 1) * apK * ldK;
  // Адаптивна (HEM): майже вся довжина кромки, але не більше 2,5·D; далі обмежує відгин
  else if (O.ap === 'full') apRaw = (insT ? (lc > 0 ? lc : Math.min(0.25 * D, 4)) : Math.min(lc > 0 ? lc : 2 * D, 2.5 * D)) * apK * ldK;
  // Важкий обробний центр: монолітна фреза в металі бере в пазу до 0,25·D (норма 0,1·D — для порталу); далі — перевірка міцності
  else if (O.ap === 'apSlot') apRaw = mat.apSlot * apBoost * D * (O.apK || 1) * apK * ldK;
  else if (O.ap === 'apSide') {
    const base = aeFrac > 0.3 ? mat.apSide + (mat.apSlot - mat.apSide) * Math.min(1, (aeFrac - 0.3) / 0.6) : mat.apSide;
    apRaw = base * apBoost * D * (O.apK || 1) * apK * ldK;
  } else if (O.ap === 'apEngr') apRaw = mat.apEngr * apK;
  // чисте дно: один тонкий прохід — до 0,5 мм (більше — лиши на чорнову)
  else if (O.ap === 'floor') apRaw = Math.min(0.5, lc > 0 ? lc : 0.5);
  // отвір по спіралі: крок за оберт — як глибина паза, але спіраль не крутіша за кут рампи матеріалу (по траєкторії центру)
  else if (O.ap === 'bore') apRaw = Math.min(insT ? (lc > 0 ? lc : Math.min(0.25 * D, 4)) * apK : mat.apSlot * apBoost * D * apK * ldK,
    Math.PI * (Dh - D) * Math.tan((mat.ramp || 3) * rad) * Math.min(1, M.ap));
  else if (O.ap === 'face') apRaw = insT ? Math.min(lc > 0 ? lc : 3, metal ? 1.5 : 3) * M.ap * RG.ap : Math.min(1.5, mat.apSlot * D * 0.1) * M.ap;
  // Свердління: крок виведення (peck) у металі 0,5–1×D (твердосплав, ЗОР), у дереві й пластику — до 2×D
  else if (O.ap === 'drill') apRaw = metal ? D * (mach.rigid === 'heavy' ? 1 : 0.5) : Math.max(0.2, mat.apSlot * D * 2);
  if (lc > 0 && apRaw > lc && op !== 'engrave') apRaw = lc;
  // (у фрези з пластинами глибина понад кромку — просто кілька проходів; корпус вужчий за Ø пластин)
  if (!insT && lc > 0 && depth > lc && ((O.cut && op !== 'face') || op === 'drill'))
    say('b', `Глибина ${fmt(depth, 2)} мм більша за різальну частину (${fmt(lc, 1)} мм) — фреза не дістане, хвостовик тертиме об матеріал. Візьми довшу фрезу або зменш глибину.`);
  // Виліт менший за глибину — цанга чи патрон зачепить заготовку
  else if (num(tool.lo) > 0 && ((O.cut && op !== 'face') || op === 'drill') && depth > num(tool.lo) - 1)
    say('b', `Глибина ${fmt(depth, 2)} мм більша за виліт ${insT ? 'фрези з оправки' : 'з цанги'} (${fmt(num(tool.lo), 1)} мм) — патрон зачепить заготовку. Висунь фрезу більше (обережно з відгином) або зменш глибину.`);
  // Затиск у цанзі: хвостовика всередині має бути ≈2,5 Ø (12–30 мм), інакше фрезу висмикне або розіб'є
  const olT = num(tool.ol), loT = num(tool.lo);
  if (!insT && olT > 0 && loT > 0) {
    const grip = olT - loT, need = clamp(2.5 * shank, 12, 30);
    if (loT >= olT) say('b', `Виліт ${fmt(loT, 1)} мм не може бути більшим за довжину фрези (${fmt(olT, 1)} мм) — перевір числа в картці.`);
    else if (grip < need) say(grip < need * 0.6 ? 'b' : 'w', `У цанзі лише ${fmt(grip, 1)} мм хвостовика — замало (треба від ${fmt(need)} мм): фрезу може висмикнути або розбити. Засунь глибше.`);
    else if (lc > 0 && loT < lc - 1 && op !== 'drill') say('i', `Цанга затискає фрезу по різальній частині (виліт ${fmt(loT, 1)} < ${fmt(lc, 1)} мм) — тримає гірше, ніж за гладкий хвостовик.`);
  }

  // 4. Модель навантаження: сила різання → відгин і напруження у фрезі, потужність
  const E = insT || tool.tm === 'hss' ? 210000 : 600000;         // модуль пружності, Н/мм² (сталевий корпус / HSS / твердосплав)
  const sAllow = insT ? 600 : tool.tm === 'hss' ? 700 : 1000;     // допустиме напруження на згин, МПа (із запасом)
  const De = D * (insT ? 0.85 : zIn <= 1 ? 0.7 : zIn === 2 ? 0.75 : 0.8); // «серцевина» фрези в зоні канавок
  const lf = lc > 0 ? Math.min(lc, L) : Math.min(L, 3 * D);
  const checkForce = !!O.cut;
  // Допустимий відгин: чистова — 0,03; чорнова пластинами лишає припуск 0,3–0,5 мм — до 0,2
  // (сталий відгин на чистовій знімається корекцією D у стійці, тому 0,05)
  // напівчистова лишає припуск 0,15 — відгин до 0,08 (метал)
  const light = !!(O.fin || O.semi);
  const tol = num(DB.cfg.tol) > 0 ? num(DB.cfg.tol) : 0.05;
  // чорнова монолітною в металі: на важкому центрі до 0,1 (лишається припуск), на порталі — менше, бо там віджим ще й рама
  let deflLim = O.fin ? tol : O.semi ? (metal ? 0.08 : 0.1) : insT ? 0.2 : metal ? ({ heavy: 0.1, mid: 0.08, light: 0.06 }[mach.rigid] || 0.08) : 0.1;
  // самокалібрування: якщо ця фреза вже працювала з більшим (розрахунковим) відгином і ти поставив «Добре» — дозволяємо стільки ж
  // і для своїх значень теж — щоб той самий режим не отримував різних оцінок у розрахунку й у перевірці
  const cal = !opts.noCalib ? calibFor(tool, O.fin ? 'fin' : O.semi ? 'semi' : 'rough') : null;
  if (cal && cal.defl > deflLim) {
    // чистова: віджим — це прямо похибка стінки, тож дозвіл з досвіду — не більше 2 допусків
    const lim2 = Math.min(cal.defl, deflLim * (O.fin ? 2 : 3));
    say('i', `Підлаштовано під твій досвід: ця фреза ${fmtDate(cal.ts)} різала з розрахунковим віджимом ${fmt(cal.defl, 3)} мм і ти поставив «Добре» — дозволяю до ${fmt(lim2, 3)} мм замість ${fmt(deflLim, 3)}.`);
    deflLim = lim2;
  }
  // биття: цанга ER ≈0,01, корпус з пластинами — 0,03 (бриф цеху: 0,03–0,05)
  const runout = num(tool.runout) > 0 ? num(tool.runout) : insT ? 0.03 : 0.01;
  const aeR = ae > 0 ? Math.min(1, ae / (op === 'engrave' ? Deff : D)) : 1;
  // Вузьке зняття → стружка тонша за подачу на зуб, компенсуємо: чорнова — до ×1,8, чистова й напівчистова — до ×1,4
  // (так виходить і на перевірених режимах цеху: Ø10 по 40Х — 3500 об/хв, F500)
  const thin = O.cut && aeR < 0.5 && !insFin ? Math.min(light ? 1.4 : 1.8, 1 / Math.sqrt(1 - Math.pow(1 - 2 * aeR, 2))) : 1;
  const kr = krSet(mat);
  // Чисте дно: подача на оберт (уже з поправкою на тонку стружку) — не більша за ту, що дає потрібну Ra
  if (op === 'floor' && reIns > 0) {
    const fRev = Math.sqrt(32 * reIns * raT / 1000);
    if (fzBase * thin * z > fRev) { fzBase = fRev / (z * thin); raLimited = true; }
  }

  // F тут — по краю фрези (від нього стружка); межа верстата — для центру, тож у отворі по спіралі вона більша в boreK раза
  const fLimE = fLim * boreK;
  function evalCut(apE, fz, nStart, noClamp) {
    let n = nStart, F = fz * z * n, nDrop = false;
    if (!noClamp && F > fLimE) {
      const n2 = Math.max(rpmMin, Math.floor(fLimE / (fz * z) / (nStart >= 3000 ? 100 : 10)) * (nStart >= 3000 ? 100 : 10));
      if (n2 < n) { n = n2; nDrop = true; }
      F = Math.min(fz * z * n, fLimE);
    }
    const fzR = F / (z * n);
    const r = { n, F, fzR, nDrop, P: 0, Pav: 0, powerPct: 0, defl: 0, stressPct: 0, Fr: 0, hMax: fzR };
    if (op === 'drill') {
      // момент на свердлі: M = kc·f·D²/8 (f — подача на оберт), кромка під кутом вершини; kc +15% на поперечну кромку
      const hD = fzR * Math.sin((tool.tm === 'hss' ? 59 : 70) * rad), kcD = kcAt(mat.kc1, hD) * 1.15;
      const Mc = kcD * (2 * fzR) * D * D / 8;
      r.P = Mc * 2 * Math.PI * n / 60 / 1e6 / 0.8;
      // скручування: еквівалентний Ø перерізу спірального свердла ≈ 0,5·D; допустимо ТС 650, HSS 450 МПа
      r.Mc = Mc; r.stressPct = 16 * Mc / (Math.PI * Math.pow(0.5 * D, 3)) / (tool.tm === 'hss' ? 450 : 650);
      r.hMax = hD;
    } else if (op !== 'f3d' && apE > 0) {
      const Dc = op === 'engrave' ? Deff : D;
      const ratio = clamp(ae / Dc, 0.001, 1);
      const phi = Math.acos(1 - 2 * ratio);
      // товщина стружки: вузьке зняття — тонша (sin φ), кут у плані κ < 90° — ще тонша (sin κ)
      const hN = (ratio < 0.5 ? fzR * Math.sin(phi) : fzR) * axK;
      r.hMax = hN * sK;
      const hm = fzR * 2 * ratio / phi;
      const kcm = kcAt(mat.kc1, hm * sK);
      const mrr = apE * ratio * Dc * F;                  // мм³/хв
      r.P = kcm * mrr / 60e6 / 0.8;                       // кВт, ККД 0,8
      if (checkForce) {
        const FtAvg = kcm * mrr / (Math.PI * Dc * n);    // середня колова сила, Н
        // пікові сили: кілька зубів у контакті, спіраль, радіальна складова; з биттям один зуб бере більше
        const cf = cutForce(apE, fzR * axK, Dc, ratio, z, beta, mat.kc1, sK, 0, kr);
        const cfE = runout > 0 && z > 1 ? cutForce(apE, fzR * axK, Dc, ratio, z, beta, mat.kc1, sK, runout * axK, kr) : cf;
        // відгин: чорнова — повна сила; чистова й напівчистова — складова поперек подачі від зуба з биттям
        // (саме він формує стінку). Міцність — повна сила з биттям. Середня — лише запобіжник від пропуску піку.
        let Fr = Math.max(light ? cfE.wall : cf.res, 0.5 * FtAvg), FrS = Math.max(cfE.res, 0.5 * FtAvg);
        // виборка: перший прохід іде повним пазом — на злам перевіряємо саме його
        if (op === 'pocket' && ratio < 0.999) FrS = Math.max(FrS, cutForce(apE, fzR * axK, Dc, 1, z, beta, mat.kc1, sK, runout > 0 && z > 1 ? runout * axK : 0, kr).res);
        const a = Math.max(apE / 2, L - apE / 2);          // плече від цанги до центру різання
        const sEx = Math.min(Math.max(0, L - lf), a);       // відкритий хвостовик
        const Is = Math.PI * Math.pow(shank, 4) / 64, If = Math.PI * Math.pow(De, 4) / 64;
        // ступінчаста консоль: біля цанги — гладкий хвостовик (Is) довжиною sEx, далі до точки сили — канавки (If)
        r.defl = Fr / (3 * E) * (Math.pow(a - sEx, 3) / If + (Math.pow(a, 3) - Math.pow(a - sEx, 3)) / Is);
        const s1 = 32 * FrS * a / (Math.PI * Math.pow(sEx > 0 ? shank : De, 3));
        const s2 = 32 * FrS * (a - sEx) / (Math.PI * Math.pow(De, 3));
        r.stressPct = Math.max(s1, s2) / sAllow; r.Fr = Fr; r.FrS = FrS;
      }
    }
    r.Pav = (num(mach.powerKw) || 0) * Math.min(1, n / (num(mach.rpmRated) || rpmMax));
    // виборка: на першому (пазовому) проході потужність більша — перевіряємо й її
    const Pchk = op === 'pocket' && apE > 0 && ae > 0 && ae < D * 0.999 ? Math.max(r.P, kcAt(mat.kc1, fzR * 2 / Math.PI * sK) * apE * D * F / 60e6 / 0.8) : r.P;
    r.powerPct = r.Pav > 0 ? Pchk / r.Pav : 0; r.Pchk = Pchk;
    return r;
  }

  let res, apCur = apRaw, passes = NaN, apE = NaN, dK = 1, limAp = false, limFz = false, hardFail = false, first = null;
  const apFloor = insT ? Math.max(0.1, (insert && Array.isArray(insert.ap) && insert.ap[0]) || 0.2) : Math.max(0.05, 0.05 * D), fzFloor = fzLo * 0.6;
  const plan = () => {
    if (op === 'f3d' || !(apCur > 0)) { passes = NaN; apE = NaN; return; }
    passes = Math.max(1, Math.ceil(depth / apCur - 1e-6)); apE = depth / passes;
  };
  const depthK = () => (O.cut && op !== 'face' && apE > D ? Math.max(0.5, 1 - 0.25 * (apE / D - 1)) : 1);
  if (fixed) {
    if (num(fixed.ap) > 0) apCur = num(fixed.ap);
    plan(); dK = depthK();
    // свої значення: у отворі по спіралі подача вписана по центру фрези — для стружки переводимо на край
    const F0 = num(fixed.F) > 0 ? num(fixed.F) * boreK : fzBase * thin * dK * z * n0;
    res = evalCut(apE, F0 / (z * n0), n0, true);
  } else {
    for (let it = 0; it < 40; it++) {
      plan(); dK = depthK();
      res = evalCut(apE, fzBase * thin * dK, n0);
      const parts = { stress: checkForce || op === 'drill' ? res.stressPct / 0.8 : 0, defl: checkForce ? res.defl / deflLim : 0, power: res.Pav > 0 ? res.powerPct / 0.85 : 0 };
      if (!first) first = parts;
      const over = Math.max(parts.stress, parts.defl, parts.power);
      if (over <= 1) break;
      const k = Math.max(0.5, 0.97 / over);
      if (O.cut && (op !== 'face' || insT) && apE > apFloor * 1.01) { apCur = Math.max(apFloor, apE * k); limAp = true; continue; }
      if (fzBase * k * thin * dK >= fzFloor) { fzBase *= k; limFz = true; continue; }
      fzBase = fzFloor / (thin * dK); limFz = true; hardFail = true;
      plan(); dK = depthK(); res = evalCut(apE, fzBase * thin * dK, n0);
      break;
    }
  }

  // 5. Повідомлення
  if (res.nDrop) say('i', `Подача впирається в максимум ${op === 'drill' ? 'осі Z' : 'верстата'} (${fmt(fLim)} мм/хв) — оберти знижено до ${fmt(res.n)}, щоб фреза різала, а не терла.`);
  if (limAp || limFz) {
    const why = first.stress >= first.defl && first.stress >= first.power ? (op === 'drill' ? 'свердло могло б скрутитися' : insT ? 'перевантаження корпусу і пластин' : 'фреза могла б зламатися')
      : first.defl >= first.power ? 'фрезу віджимало б — неточність і вібрація' : 'шпинделю забракло б потужності';
    const what = [limAp ? `глибину за прохід до ${fmt(rAp(apE), 2)} мм` : '', limFz ? `подачу на зуб до ${fmt(res.fzR, 3)} мм` : ''].filter(Boolean).join(' і ');
    if (hardFail && res.stressPct > 0.8) say('b', `Ця фреза не витримує такої обробки навіть на мінімумі — ризик поломки (${Math.round(res.stressPct * 100)}% від межі міцності). Візьми коротший виліт, фрезу більшого діаметра або іншу операцію.`);
    else if (hardFail && res.Pav > 0 && res.powerPct > 0.85) say('b', `Шпинделю не вистачає потужності навіть на мінімальних режимах (${fmt(res.P, 1)} з ${fmt(res.Pav, 1)} кВт). Візьми меншу фрезу або менший крок.`);
    else if (hardFail) say('w', `Навіть на мінімумі фрезу віджимає на ${fmt(res.defl, 3)} мм (межа ${fmt(deflLim, 3)}) — розміри попливуть, можлива вібрація. Засунь фрезу глибше в цангу або візьми коротшу/товщу.`);
    else say('i', `Захист спрацював: апка зменшила ${what}, бо інакше ${why}. Показані цифри вже безпечні.`);
  }
  if (fixed && op === 'drill' && res.stressPct > 0.85) say('b', `Свердло перевантажене на скручування (${Math.round(res.stressPct * 100)}% від межі) — ризик злому. Зменш подачу на оберт.`);
  if (fixed && checkForce) {
    if (res.stressPct > 0.85) say('b', `Ці значення перевантажують фрезу (${Math.round(res.stressPct * 100)}% від межі міцності) — ризик поломки.`);
    else if (res.defl > deflLim) say('w', `З цими значеннями фрезу віджимає на ${fmt(res.defl, 3)} мм (межа ${fmt(deflLim, 3)})${O.fin ? ' — стінка вийде з конусом і розмір попливе. Зменш глибину за прохід або виліт.' : O.semi ? ' — стінка вийде з конусом: лиши на чистову припуск більший за відгин або зменш глибину за прохід.' : '.'}${num(tool.lo) > 0 ? '' : ' Виліт у картці фрези не вписано — взято типовий, впиши свій для точності.'}`);
  }
  if (fixed && res.Pav > 0 && res.powerPct > 0.9) say(res.powerPct > 1 ? 'b' : 'w', res.powerPct > 1
    ? `Потрібна потужність ${fmt(res.Pchk || res.P, 1)} кВт — більше, ніж шпиндель дає на ${fmt(res.n)} об/хв (${fmt(res.Pav, 1)} кВт). Шпиндель загальмує або виб'є захист.`
    : `Потрібна потужність ${fmt(res.Pchk || res.P, 1)} кВт — майже вся, що є у шпинделя на цих обертах.`);
  if (fixed && res.F / boreK > fLim * 1.001) say('b', `Подача ${fmt(res.F / boreK)} мм/хв більша за максимум верстата (${fmt(fLim)}).`);
  if (fixed && op !== 'f3d' && res.hMax > fzHi * dK * 1.5) say('b', `Стружка ${fmt(res.hMax, 3)} мм — це в ${fmt(res.hMax / (fzHi * dK), 1)} раза товща за максимум довідника. Ризик зламати ${op === 'drill' ? 'свердло' : insT ? 'пластину' : 'фрезу'} або зірвати заготовку.`);
  // Нижня межа стружки (тоншу кромка не ріже, а тре). На глибині > 1D норму зсуваємо на той самий коефіцієнт, що й подачу.
  // Пластини: кромка заокруглена ~0,02 мм; чистова пластинами з малим зняттям — до 0,012; чистова монолітною гострою кромкою — 0,006.
  const rubLo = fzLo * dK, cutOp = op !== 'f3d' && op !== 'engrave' && op !== 'drill', chipOp = op !== 'f3d' && op !== 'engrave';
  const rubMin = insFin ? 0.012 : insT ? 0.02 : light ? 0.006 : rubLo * 0.65;
  if (chipOp && res.hMax < rubMin) {
    const what = mat.g === 'wood' ? 'горітиме і тупитиметься' : mat.g === 'plastic' ? 'плавитиме пластик' : metal ? 'тертиме і перегріватиметься' : 'тертиме';
    const fix = light ? 'Збільш зняття збоку або подачу.' : res.n <= rpmMin + 1 ? 'Оберти вже мінімальні — візьми фрезу з меншою кількістю зубів або збільш крок.' : 'Зменш оберти або візьми фрезу з меншою кількістю зубів.';
    say('w', `Стружка затонка (${fmt(res.hMax, 3)} мм при нормі від ${fmt(rubMin, 3)}) — ${insT ? 'пластина' : 'фреза'} ${what}. ${fix}`);
  } else if (chipOp && light && !insT && fixed && res.hMax < rubLo * 0.65) {
    // свої значення на чистовій: підказка, на скільки можна підняти подачу
    const Fs = rF(Math.min(res.F * Math.min(1.4, rubLo * 0.65 / Math.max(res.hMax, 1e-4)), fLim));
    if (Fs > res.F * 1.05) say('i', `Стружка тонка (${fmt(res.hMax, 3)} мм): кромка більше тре і швидше тупиться. Якщо шорсткість дозволяє — можна підняти подачу до ~${fmt(Fs)} мм/хв.`);
  } else if (metal && cutOp && D >= 6 && res.fzR < 0.02)
    say('w', `Подача на зуб ${fmt(res.fzR, 3)} мм — менше 0,02: кромка тертиме замість різати і перегріється. Підніми подачу або зменш оберти.`);
  // Паспорт пластини: подача і глибина з коробки
  const boxFz = insT && insert && Array.isArray(insert.fz) && insert.fz[0] > 0 ? insert.fz : null;
  if (boxFz && cutOp) {
    // паспорт дає подачу для звичайного зняття; при вузькому стружка тонша — порівнюємо її еквівалент
    const fzEq = res.hMax / sK / (axK || 1);
    if (fzEq > boxFz[1] * 1.05) say('b', `Подача на зуб ${fmt(res.fzR, 3)} мм${fzEq < res.fzR * 0.97 ? ` (при цій ширині зняття стружка — як від ${fmt(fzEq, 3)})` : ''} більша за паспорт пластини (до ${fmt(boxFz[1], 2)}) — ризик сколу кромки.`);
    else if (res.fzR < boxFz[0] * 0.95) say(O.fin ? 'i' : 'w', `Подача на зуб ${fmt(res.fzR, 3)} мм нижча за паспорт пластини (від ${fmt(boxFz[0], 2)})${O.fin ? ' — на чистовій це допустимо, але пластина тупиться швидше.' : ' — пластина тертиме і швидко зноситься.'}`);
  }
  if (fixed && insT && apE > 0 && op !== 'f3d') {
    // межа — за фактичною шириною зі «своїх значень» (вона може відрізнятися від ширини на екрані)
    const narF = ae > 0 && ae / D <= 0.35 && op !== 'face', edgeL = insert && num(insert.len) > 0 ? num(insert.len) : NaN;
    const apLimF = apBox > 0 ? (narF && apEdge > apBox ? apEdge : apBox) : Math.min(0.25 * D, 4);
    if (edgeL > 0 && apE > edgeL * 1.02) say('b', `Глибина за прохід ${fmt(apE, 2)} мм більша за довжину кромки пластини (${fmt(edgeL, 1)} мм) — пластина не дістане, корпус тертиме об матеріал.`);
    else if (apE > apLimF * 1.05) say(apBox > 0 ? 'w' : 'i', apBox > 0 ? `Глибина за прохід ${fmt(apE, 2)} мм більша за паспорт пластини (${narF ? 'кромка ' : 'до '}${fmt(apLimF, 1)} мм) — перевантаження пластини.`
      : `Глибина за прохід ${fmt(apE, 2)} мм більша за типову для пластин (${fmt(apLimF, 1)} мм) — привʼяжи пластину до фрези, щоб апка звірила з паспортом.`);
    else if (insert && Array.isArray(insert.ap) && insert.ap[0] > 0 && apE < insert.ap[0] * 0.95) say('i', `Глибина ${fmt(apE, 2)} мм менша за паспортний мінімум пластини (${fmt(insert.ap[0], 2)}) — радіус кромки ковзає, чистота може бути гіршою.`);
  }
  if (fixed && cutOp) {
    const Vr = Math.PI * Deff * res.n / 1000;
    if (Vr > vMax * 1.1 && !spindleMode) say('w', `Швидкість різання ${fmt(Vr)} м/хв вища за норму (${fmt(vMin)}–${fmt(vMax)}) — швидкий знос ${insT ? 'пластин' : 'фрези'}.`);
    else if (metal && Vr < vMin * 0.75) say('i', `Швидкість різання ${fmt(Vr)} м/хв нижча за норму (${fmt(vMin)}–${fmt(vMax)}) — неефективно, на сталі можливий наріст на кромці.`);
  }
  if (op === 'drill' && metal && apE > 0) say('tip', depth > 3 * D
    ? `Отвір глибший за 3D — свердли з повним виведенням стружки (Fusion: «Deep drilling – full retract», у стійці CYCLE83), крок ${fmt(rAp(apE), 2)} мм.`
    : `Отвір до 3D — досить ламання стружки (Fusion: «Chip breaking»), крок ${fmt(rAp(apE), 2)} мм.`);
  if (insFin && metal) say('tip', 'Биття пластинчастих фрез 0,03–0,05 мм, монолітних — 0,005–0,01. Для допуску ±0,05 чистову роби монолітною фрезою.');
  if (light && metal) say('tip', 'Після напівчистової заміряй розмір: різницю з теоретичним поділи навпіл і внеси в корекцію радіуса D у стійці.');
  // у отворі по спіралі в CAM іде подача центру фрези (край — швидше в boreK раза)
  const n = res.n, F = fixed ? res.F / boreK : Math.min(rF(res.F / boreK), fLim);
  let boreLen = NaN, boreMin = NaN;
  if (op === 'bore') {
    // спіраль: оберти × коло центру + одне чистове коло на дні
    boreLen = ((passes || 1) + 1) * Math.PI * (Dh - D); boreMin = boreLen / F;
    say('tip', `Fusion: операція «Bore» (або 2D Contour з Ramp → Helical). Подача в CAM — по центру фрези: ${fmt(F)} мм/хв, по краю виходить ${fmt(F * boreK)} — саме від краю рахується стружка. Крок (Pitch) — ${fmt(rAp(apE), 2)} мм за оберт, наприкінці — одне коло без заглиблення.`);
    if (Dh < 1.3 * D) say('w', `Отвір Ø${fmt(Dh, 2)} лише трохи більший за фрезу — спіраль майже вертикальна, фреза працює торцем як свердло і погано виводить стружку. Краще спершу просвердли Ø${fmt(Math.max(1, Math.floor((Dh - 0.6) * 2) / 2), 1)}.`);
    if (insT && !(preD > 0) && Dh < 1.7 * D) say('w', 'Фреза з пластинами в центрі не ріже: без попереднього отвору при такому малому Ø торець корпусу впреться в матеріал. Перевір мінімальний Ø у каталозі корпусу або спершу просвердли.');
    if ((Dh - D) / 2 > D / 2 && !(preD >= Dh - 2 * D)) say('i', `Отвір більший за 2 Ø фрези — в центрі лишиться стрижень Ø${fmt(Dh - 2 * D, 1)}: наприкінці він відламається і може вдарити фрезу. Краще спершу просвердли або обери «Виборка» (кругова кишеня).`);
  }
  // врізання по Z: монолітна з центральним різанням у металі — ≈30% подачі; мʼякі — з довідника матеріалу;
  // фреза з пластинами вертикально не врізається (лише рампою), торцева — заходить збоку
  const plungeHow = op === 'drill' ? 'drill' : op === 'bore' ? 'helix' : tool.type === 'iface' || tool.type === 'surf' ? 'side' : insT ? 'ramp' : 'z';
  let Fz = op === 'drill' ? F : rF(F * (metal ? 0.3 : mat.plunge));
  if (fixed && num(fixed.Fz) > 0 && op !== 'drill') Fz = num(fixed.Fz);
  if (op !== 'drill' && Fz > feedMaxZ && !fixed) { Fz = feedMaxZ; say('i', `Врізання обмежено максимумом осі Z (${fmt(feedMaxZ)} мм/хв).`); }
  if (fixed && op !== 'drill' && Fz > feedMaxZ * 1.001) say('w', `Врізання ${fmt(Fz)} мм/хв більше за максимум осі Z (${fmt(feedMaxZ)}) — верстат обріже або видасть помилку.`);
  if (n <= rpmMin && rpmMin > 0 && n < 9000) say('i', 'Шпиндель на мінімальних обертах слабкий, а з повітряним охолодженням ще й гріється — довго так не працюй.');
  if (metal && iso !== 'N' && mach.rigid !== 'heavy') say('w', 'Сталь, чавун чи титан на порталі — лише легкими проходами, з охолодженням і без вібрації. Почни з режиму «Обережно».');
  if (iso === 'H' && metal && !insT && tool.tm === 'hss') say('b', 'HSS не ріже загартовану сталь — потрібен твердосплав HRC 55+ з покриттям.');
  if (iso === 'H' && metal && op === 'slot') say('w', 'Паз на всю ширину в загартованій сталі — велике навантаження на кромку. Краще адаптивна виборка з вузьким кроком.');
  if (tool.tm === 'hss' && metal) say('i', 'HSS у металі — лише з ЗОР, швидкість різання знижено.');
  if (O.cut && op !== 'face' && op !== 'bore' && (metal || mat.g === 'plastic' || mat.g === 'composite')) say('tip', `Врізання — по спіралі або рампою під кутом до ${fmt(mat.ramp || 3, 1)}°, а не вертикально.${metal ? ' Фрезеруй попутно (climb): менше наклепу і віджиму.' : ''}`);
  if (tool.type === 'surf') say('tip', 'Торцевою фрезою не врізайся вертикально — заходь з краю заготовки.');
  if (tool.type === 'comp' && O.cut) say('tip', 'Компресійна: перший прохід — глибше за висоту нижньої (up-cut) частини, зазвичай від 5–6 мм, інакше верхній край буде рваний.');
  // Пластини на торцюванні — насухо: слабка емульсія на перервному різанні дає термоудар
  const dry = insT && op === 'face' && metal;
  if (dry) say('tip', 'Торцювання пластинами — насухо або з сильним обдувом: слабка емульсія дає термоудар і мікротріщини кромки. Монолітні фрези в глибоких пазах — навпаки, лише з рясною ЗОР.');
  else if (mat.cool) say('tip', 'Потрібне охолодження: ЗОР, масляний туман або хоча б сильний обдув.');
  // Охолодження для CAM: Flood — ЗОР (M8), Air — обдув, Suction — аспірація пилу, Off — без нічого
  let cool = metal ? (dry || !mat.cool ? 'air' : 'flood') : mat.g === 'composite' ? 'suction' : mat.g === 'plastic' ? 'air' : 'off';
  if (cool === 'flood' && !wet) cool = 'air';
  else if (cool === 'flood' && mCool === 'mist') cool = 'mist';
  // Рампа: у металі ≈60% робочої подачі, у мʼяких матеріалах ≈80%
  const Framp = O.cut && op !== 'face' && op !== 'floor' && op !== 'bore' ? Math.min(fixed ? F * (metal ? 0.6 : 0.8) : rF(F * (metal ? 0.6 : 0.8)), feedMax) : NaN;
  if (plungeHow === 'ramp' && O.cut && op !== 'face' && op !== 'floor') { if (!fixed) Fz = Framp; say('tip', 'Фреза з пластинами вертикально не врізається — лише рампою (зазвичай до 2–5°, дивись каталог корпусу) або спіраллю.'); }
  if (plungeHow === 'side' && O.cut) say('tip', 'Торцева фреза заходить у матеріал збоку, з краю заготовки — не врізайся нею вертикально.');
  // Внутрішній кут радіуса Rc: фрезу обхоплює більше (кут контакту φк) і кромка біля стінки йде швидше за центр (Rc/Rt).
  // Подачу в куті знижуємо, щоб пікова сила і стружка лишились як на прямій.
  let corner = null;
  const Rc = num(opts.cornerR);
  if (Rc > 0 && ['pocket', 'adaptive', 'contour', 'semi', 'finish'].includes(op) && ae > 0) {
    const r = D / 2;
    if (Rc < r * 0.999) say('b', `Радіус кута R${fmt(Rc, 2)} менший за радіус фрези (${fmt(r, 2)}) — фреза в кут не влізе, лишиться недоріз. Для кутів візьми фрезу Ø ≤ ${fmt(2 * Rc, 1)} мм.`);
    else if (Rc < r * 1.02) say('w', `Радіус кута R${fmt(Rc, 2)} дорівнює радіусу фрези — у куті її обхопить на 180°, як у пазу, з різким стрибком сили. Сповільни подачу в кутах удвічі або дорізай кути меншою фрезою.`);
    else {
      const Rt = Rc - r, Rp = Math.max(0, Rc - ae);
      const arg = Rt > 1e-6 ? (Rp * Rp - Rt * Rt - r * r) / (2 * Rt * r) : -1;
      const phiC = Math.acos(clamp(arg, -1, 1)), phiS = Math.acos(clamp(1 - 2 * ae / D, -1, 1));
      const kEng = phiC / Math.max(phiS, 1e-6), kEdge = Math.min(5, Rc / Math.max(Rt, 1e-6));
      const Fc = Math.min(F, rF(F / kEdge / Math.pow(Math.max(1, kEng), 0.7)));
      corner = { Rc, phiC, phiS, kEng, kEdge, Fc, pct: Math.round(Fc / F * 100) };
      if (kEng > 1.3 || kEdge > 1.5)
        say(kEng > 2.5 || Rc < r * 1.15 ? 'w' : 'i', `Внутрішній кут R${fmt(Rc, 2)}: фрезу обхоплює на ${fmt(phiC / rad, 0)}° замість ${fmt(phiS / rad, 0)}°, кромка біля стінки йде в ${fmt(kEdge, 1)} раза швидше. Подачу в кутах — до ${fmt(Fc)} мм/хв (${corner.pct}%).${Rc < r * 1.3 ? ' Краще кут R ≥ 1,3 радіуса фрези — або дорізати кути меншою фрезою.' : ''}`);
    }
  }
  // Шорсткість дна (пластини або фреза з радіусом при вершині): через биття дно робить одна кромка
  let ra = NaN;
  if ((op === 'floor' || op === 'face') && reIns > 0) {
    const fRev = F / n;
    ra = fRev * fRev / (8 * reIns) * 1000 / 4;
    if (op === 'floor' && raLimited && !fixed) say('i', `Подачу обмежено шорсткістю: для Ra ${fmt(raT, 1)} при радіусі ${fmt(reIns, 1)} мм — не більше ${fmt(Math.sqrt(32 * reIns * raT / 1000), 3)} мм на оберт.${insT ? ' Пластина-зачисна (wiper) дала б ту саму шорсткість на вдвічі більшій подачі.' : ''}`);
    if (op === 'floor' && ra > raT * 1.05) say('w', `Шорсткість дна ≈ Ra ${fmt(ra, 1)} мкм — грубіше за потрібні ${fmt(raT, 1)}. Зменш подачу на оберт до ${fmt(Math.sqrt(32 * reIns * raT / 1000), 3)} мм.`);
  }
  // Віджим на чистовій = конус стінки; повторний прохід без зняття знімає більшу частину
  if (O.fin && checkForce && res.defl > 0.01) say('i', `Розрахунковий віджим ${fmt(res.defl, 3)} мм — стінка може вийти з конусом до цієї величини (допуск ±${fmt(tol, 2)}). Повторний прохід без зняття (spring pass) прибирає більшу частину.`);
  // Биття співмірне з подачею на зуб — у дрібних фрез один зуб бере вдвічі більше, решта тре
  if (!insT && !corn && z > 1 && O.cut && runout > 0.5 * res.fzR && D <= 8)
    say('w', `Биття ${fmt(runout, 3)} мм співмірне з подачею на зуб ${fmt(res.fzR, 3)} — зуб з найбільшим вильотом бере в ${fmt((res.fzR + runout) / res.fzR, 1)} раза більше. Для дрібної фрези: прецизійна цанга (≤0,005), 1–2-заходна фреза або вища подача.`);

  let scallop = NaN;
  if (op === 'f3d' && ae > 0) { const R = D / 2; scallop = R - Math.sqrt(Math.max(0, R * R - ae * ae / 4)); }

  return {
    op, D, Deff, z, n, F, Fz, ap: rAp(apE), apRaw: rAp(apRaw), passes, ae: rAp(ae), aePct: ae > 0 ? Math.round(ae / (op === 'engrave' ? Deff : D) * 100) : NaN,
    total: depth, V, nIdeal, nCap, capWhy, Vreal: Math.PI * Deff * n / 1000, vMin, vMax, vCap, spindleMode, rpmMax,
    fzLo, fzHi, fzMode, fzR: res.fzR, hMax: res.hMax, thin, dK, ldK, L, ld,
    P: res.P, Pav: res.Pav, powerPct: res.powerPct, defl: res.defl, deflLim, stressPct: res.stressPct, Fr: res.Fr, checkForce, checkStress: checkForce || op === 'drill', Mc: res.Mc,
    corner, ra, raT, reIns, plungeHow, runout, axK, tol, cal, mCool, nDrop: res.nDrop, raLim: raLimited, FrS: res.FrS, Pchk: res.Pchk,
    Dh, preD, boreK, boreLen, boreMin, boreAe, rpmMin,
    limited: limAp || limFz, limWhy: first && (limAp || limFz) ? (first.stress >= first.defl && first.stress >= first.power ? 'stress' : first.defl >= first.power ? 'defl' : 'power') : '', hardFail, scallop, W, rigid: RG, mode: M, fixed: !!fixed, insT, insFin, insert, iso, kap,
    mrr: apE > 0 && ae > 0 && op !== 'f3d' && op !== 'drill' && op !== 'bore' ? apE * ae * res.F / 1000 : NaN, dry, cool, Framp, ramp: mat.ramp || 3, rubMin, light,
  };
}

function histFor(tool, matId, op, machId) {
  return Object.values(DB.hist).filter(h => h.mat === matId && h.op === op && h.mach === machId &&
    (tool.id !== '__manual' ? h.tool === tool.id
      : (h.tool === '__manual' && h.snap && h.snap.type === tool.type && +h.snap.d === num(tool.d) && +h.snap.z === num(tool.z))))
    .sort((a, b) => b.ts - a.ts);
}
function recentCombos() {
  const seen = new Set(), out = [];
  for (const h of Object.values(DB.hist).sort((a, b) => b.ts - a.ts)) {
    const toolOk = h.tool === '__manual' || DB.tools[h.tool];
    const mat = getMat(h.mat);
    // лише цей верстат: на іншому інші фрези й режими
    if (!toolOk || !mat || !OPS[h.op] || !h.snap || (h.mach && h.mach !== S.machineId && DB.machines[h.mach])) continue;
    const key = `${h.tool}|${h.tool === '__manual' ? JSON.stringify(h.snap) : ''}|${h.mat}|${h.op}`;
    if (seen.has(key)) continue; seen.add(key);
    const t = h.tool === '__manual' ? h.snap : DB.tools[h.tool];
    out.push({ h, c: GROUPS[mat.g]?.c, label: `${h.tool === '__manual' ? '✏️ ' : ''}Ø${fmt(num(t.d), 2)} ${num(t.z) || 1}${INS_TYPES.includes(t.type) ? 'пл' : 'з'} · ${mat.name.split(/[ ,(]/)[0]} · ${OPS[h.op].s}` });
    if (out.length >= 6) break;
  }
  return out;
}
async function trimHistory() {
  const arr = Object.values(DB.hist).sort((a, b) => b.ts - a.ts);
  for (const h of arr.slice(HIST_MAX)) { delete DB.hist[h.id]; await Store.del('h_' + h.id); }
}

// ---------- Сегментне табло: цифри як на стійці верстата, з тьмяними «вісімками» ----------

// text — «3800» або «8.2»; cells — скільки знакомісць (порожні світяться тьмяними вісімками); key — щоб мигнули лише змінені цифри

  const gl = [];

    else if (SEG[ch] !== undefined) gl.push({ ch, dp: false });
  }

    const c = i >= lead ? gl[i - lead] : null, on = c ? SEG[c.ch] : '';
    if (dpAt < 0 && i > 0 && intEnd - i === 3) x += 12;          // проміжок між тисячами: 24 000
    sig.push(c ? c.ch + (c.dp ? '.' : '') : '');

// Групи за верстатом: спершу активний, потім «будь-який», потім інші
function toolGroups(tools) {
  if (!tools.some(t => DB.machines[t.mach])) return [['', tools]];
  const g = new Map(), rank = k => (k === S.machineId ? 0 : k === '' ? 1 : 2);
  for (const t of tools) { const k = DB.machines[t.mach] ? t.mach : ''; if (!g.has(k)) g.set(k, []); g.get(k).push(t); }
  return [...g.keys()].sort((a, b) => rank(a) - rank(b))
    .map(k => [k ? `${machineArt(machModelOf(DB.machines[k]))}${esc(DB.machines[k].name)}` : `${ic('tools')}Для будь-якого верстата`, g.get(k)]);
}
function renderToolList() {
  if (S.toolsSub === 'ins') return renderInsList();
  const q = S.qTools.trim().toLowerCase();
  const tools = sortedTools().filter(t => !q || `${t.name} ${TOOL_TYPES[t.type]} ${toolSpec(t)} ${t.coat || ''} ${t.note || ''} ${DB.machines[t.mach]?.name || ''}`.toLowerCase().includes(q));
  if (!tools.length) {
    $('#list').innerHTML = `<div class="card empty">${ic('tools')}<div>${q ? 'Нічого не знайдено' : 'Ще немає фрез.<br>Додай першу — вручну або сфотографуй 📷'}</div></div>`;
    return;
  }
  let n = 0;
  $('#list').innerHTML = toolGroups(tools).map(([h, arr]) => (h ? `<div class="grp-h">${h}<em>${arr.length}</em></div>` : '') + arr.map(t => toolCard(t, n++, 'editTool', !!h)).join('')).join('');
}

    if (!(await Store.set('t_' + o.id, o))) return;

// Подача у формах — в одиницях верстата (ArtCAM — мм/с), зберігається завжди в мм/хв
const msOf = m => !!m && (machCam(m) === 'artcam' || m.units === 'mms');
// Подача для показу — в одиницях верстата
const fF = (F, m) => (msOf(m) ? `${fmt(F / 60, F < 60 ? 2 : 1)} мм/с` : `${fmt(F)} мм/хв`);
function runFields(v, op, ms) {
  const u = ms ? 'мм/с' : 'мм/хв', fv = x => (Number.isFinite(+x) && +x > 0 ? (ms ? (x < 60 ? Math.round(x / 0.6) / 100 : Math.round(x / 6) / 10) : Math.round(x)) : '');

    <label class="f"><span>${op === 'drill' ? 'Подача свердління' : 'Подача F'}, ${u}</span><input name="F" inputmode="decimal" value="${esc(fv(v.F))}"></label>
    ${op === 'drill' ? '' : `<label class="f"><span>Врізання Z, ${u}</span><input name="Fz" inputmode="decimal" value="${esc(fv(v.Fz))}"></label>`}
    ${op === 'f3d' ? '' : `<label class="f"><span>${op === 'drill' ? 'Peck' : op === 'bore' ? 'Крок спіралі' : 'Глибина за прохід'}, мм</span><input name="ap" inputmode="decimal" value="${esc(Number.isFinite(v.ap) ? v.ap : '')}"></label>`}
    ${v.ae > 0 && op !== 'engrave' ? `<label class="f"><span>Ширина / крок, мм</span><input name="ae" inputmode="decimal" value="${esc(v.ae)}"></label>` : ''}
  </div>`;
}
function readRun(fd, prev, ms) {
  const o = { ...prev };
  for (const k of ['n', 'F', 'Fz', 'ap', 'ae']) if (fd[k] !== undefined) { const x = num(fd[k]); if (x > 0) o[k] = (k === 'F' || k === 'Fz') && ms ? Math.round(x * 60) : x; }
  for (const k of Object.keys(o)) if (!Number.isFinite(o[k])) delete o[k];
  return o;
}
// ======================= Досвід: що пішло не так → як виправити =======================
// Множники до того, з чим реально різав. m — для металу, s — для мʼяких матеріалів (дерево, пластик, композит).
const SYMPTOMS = {
  vib:   { n: 'Вібрація, дзвін', m: { ap: 0.7, n: 0.92 }, s: { ap: 0.75, n: 0.92 },
    why: 'менша глибина за прохід і оберти на 8% нижче — так виходять із резонансу. Найкраще — коротший виліт' },
  burn:  { n: 'Горить, плавиться, наріст', m: { n: 0.85 }, s: { fz: 1.2, n: 0.92 },
    why: 'метал — нижча швидкість різання і більше ЗОР; мʼякі матеріали — товща стружка (подача вище, оберти нижче), щоб тепло йшло зі стружкою' },
  brk:   { n: 'Зламалась фреза / скол пластини', m: { fz: 0.75, ap: 0.75 }, s: { fz: 0.8, ap: 0.7 },
    why: 'менша подача на зуб і глибина. Перевір биття і чи не забивається стружка' },
  surf:  { n: 'Погана поверхня', m: { fz: 0.8, n: 1.05 }, s: { fz: 0.85, n: 1.05 },
    why: 'тонша стружка і трохи вищі оберти. Ще допомагає попутне фрезерування і чистий прохід з малим зняттям' },
  size:  { n: 'Розмір поплив (віджим)', m: { ap: 0.6 }, s: { ap: 0.65 },
    why: 'менша глибина за прохід — менше віджиму. Залиш припуск і зроби окремий чистовий прохід' },
  wear:  { n: 'Швидко тупиться', m: { n: 0.85 }, s: { fz: 1.15 },
    why: 'метал — нижча швидкість різання; мʼякі матеріали — товща стружка: тонка тре кромку і гріє' },
  chips: { n: 'Стружка забивається', m: { ap: 0.75 }, s: { ap: 0.75 },
    why: 'менша глибина за прохід — стружці є куди виходити. Сильніший обдув або ЗОР' },
  fray:  { n: 'Пухнасті краї, розшарування', m: { fz: 0.85 }, s: { fz: 0.85, n: 1.08 },
    why: 'тонша стружка і вищі оберти. Якщо фреза вже пройшла багато — її час міняти' },
};
const SYM_FOR = g => (g === 'metal' ? ['vib', 'burn', 'brk', 'surf', 'size', 'wear', 'chips']
  : g === 'composite' ? ['fray', 'burn', 'vib', 'brk', 'surf', 'wear', 'size'] : ['burn', 'vib', 'brk', 'surf', 'size', 'wear', 'chips', 'fray']);
// Виправлений режим: множники перемножуються, але сумарно не більше ніж у 2 рази в будь-який бік
// lim — межі обертів верстата і фрези: виправлення не виводить за них (інакше «виправлений» режим сам стане небезпечним)
function fixRun(used, syms, metal, z, lim) {
  const k = { n: 1, fz: 1, ap: 1 };
  for (const s of syms) { const f = SYMPTOMS[s] && SYMPTOMS[s][metal ? 'm' : 's']; if (f) for (const key in f) k[key] *= f[key]; }
  for (const key in k) k[key] = clamp(k[key], 0.5, 1.4);
  let n = Math.round(used.n * k.n / 10) * 10;
  if (lim) n = clamp(n, lim.nMin || 0, lim.nMax || Infinity);
  const fz = used.F / (Math.max(1, z) * used.n) * k.fz, F = Math.round(fz * Math.max(1, z) * n);
  const o = { n, F };
  if (used.ap > 0) o.ap = rAp(used.ap * k.ap);
  if (used.ae > 0) o.ae = used.ae;
  if (used.Fz > 0) o.Fz = Math.round(used.Fz * F / used.F);
  return { run: o, k };
}
function symChips(cur, g) {
  return `<div class="symsel">${SYM_FOR(g).map(s => `<button type="button" class="${(cur || []).includes(s) ? 'on' : ''}" data-act="sym" data-v="${s}">${esc(SYMPTOMS[s].n)}</button>`).join('')}</div>`;
}
const symOf = form => [...form.querySelectorAll('.symsel .on')].map(b => b.dataset.v);

// ======================= Ресурс інструмента =======================
// Орієнтовно, щоб вчасно міняти:
// · монолітні в металі — знос по Ø на метр ходу (бриф цеху: 0,02–0,04 мм на 6,4 м у 40Х → ~0,0047 мм/м), межа — 0,1 мм;
// · пластини — хвилини різання на одну кромку за Тейлором (n = 0,25): ~15 хв на середині паспортної швидкості;
// · дерево, пластик, композит — метри до затуплення твердосплаву.
const WEAR_MM_PER_M = { P: 0.0047, M: 0.007, K: 0.004, N: 0.0006, S: 0.01, H: 0.012 };
const WEAR_LIMIT = 0.1;
const LIFE_M = { wood: 2500, plastic: 1500, foam: 6000, composite: 600, other: 1000, p_wood: 1200, p_cfrp: 40, p_gfrp: 25, p_comp: 800 };
const EDGES = { A: 2, B: 2, K: 2, L: 2, C: 2, D: 2, E: 2, M: 2, V: 2, S: 4, T: 3, W: 3, H: 6, O: 8, P: 5, R: 4 };
const edgesOf = ins => { if (!ins) return 2; const c = insKey(ins.code), base = EDGES[ins.shape || c[0]] || 2; return c[1] === 'N' ? base * 2 : base; };
const diamond = t => /алмаз|diamond|dlc|cvd|pcd/i.test(`${t.coat || ''} ${t.name || ''}`);
// Частка ресурсу, яку зʼїла робота: m — метри ходу, min — хвилини різання, V — швидкість різання, vRef — середина норми
function lifeShare(tool, mat, m, min, V, vRef) {
  const insT = INS_TYPES.includes(tool.type), iso = matIso(mat), vk = vRef > 0 && V > 0 ? V / vRef : 1;
  if (insT) { const T = 15 * Math.pow(1 / clamp(vk, 0.5, 2), 4); return { frac: min / T, wear: 0 }; }
  if (mat.g === 'metal') {
    const wear = m * WEAR_MM_PER_M[iso] * (tool.tm === 'hss' ? 4 : 1) * clamp(vk * vk, 0.5, 3);
    return { frac: wear / WEAR_LIMIT, wear };
  }
  const L = (LIFE_M[mat.id] || LIFE_M[mat.g] || LIFE_M.other) * (tool.tm === 'hss' ? 0.2 : 1) * (diamond(tool) ? 8 : 1);
  return { frac: m / L, wear: 0 };
}
// Записати пророблену роботу в ресурс фрези
async function addUse(tool, mat, m, min, V, vRef) {
  const t = DB.tools[tool.id]; if (!t || !(m > 0)) return null;
  const s = lifeShare(t, mat, m, min, V, vRef), u = { m: 0, min: 0, frac: 0, wear: 0, jobs: 0, since: Date.now(), ...(t.use || {}) };
  u.m = +(u.m + m).toFixed(3); u.min = +(u.min + (min || 0)).toFixed(1); u.frac = +(u.frac + s.frac).toFixed(4); u.wear = +(u.wear + s.wear).toFixed(4); u.jobs++;
  t.use = u; await Store.set('t_' + t.id, t);
  return s;
}
const lifeLvl = f => (f >= 1 ? 'b' : f >= 0.8 ? 'w' : '');
// 0–100% — скільки зʼїдено; понад 100% — «вичерпано» і в скільки разів перебрано
const lifePct = f => (f >= 1 ? (f >= 1.15 ? `вичерпано ×${fmt(f, 1)}` : 'вичерпано') : `${Math.round(f * 100)}%`);
function useText(t) {
  const u = t.use; if (!u || !(u.m > 0)) return 'Ще нічого не записано. Ресурс рахується, коли зберігаєш результат з довжиною траєкторії.';
  const insT = INS_TYPES.includes(t.type), ins = DB.inserts[t.insertId];
  return [`Пройдено ${fmt(u.m, u.m < 10 ? 1 : 0)} м`, u.min > 0 ? `${fmt(u.min, 0)} хв різання` : '', u.wear > 0 ? `знос по Ø ≈ ${fmt(u.wear, 3)} мм` : '',
    insT ? `кромка ${t.edge || 1} з ${edgesOf(ins)}` : '', `${u.jobs} ${plural(u.jobs, 'робота', 'роботи', 'робіт')}`].filter(Boolean).join(' · ');
}
function lifeBar(t) {
  const f = (t.use && t.use.frac) || 0, l = lifeLvl(f);
  return `<div class="life ${l}"><div class="life-t"><span>Ресурс ${INS_TYPES.includes(t.type) ? 'кромки' : 'фрези'}</span><b>${f > 0 ? lifePct(f) : '—'}</b></div>
    <div class="life-b"><i style="width:${clamp(f, 0, 1) * 100}%"></i></div><small>${esc(useText(t))}</small></div>`;
}

// Запис історії з поточного екрана: що порахувала апка (calc) і з чим реально різав (run), з вильотом і кутами
function histRec(tool, mat, mach, run, rate, sym, note) {
  const h = { id: genId(), ts: Date.now(), mach: mach.id, machName: mach.name,
    tool: tool.id, toolName: tool.id === '__manual' ? toolAutoName(tool) : tool.name,
    snap: { type: tool.type, d: num(tool.d), z: num(tool.z) || 1, tm: tool.tm || 'carbide', lo: num(tool.lo) > 0 ? num(tool.lo) : undefined },
    mat: mat.id, matName: mat.name, op: S.op, mode: S.mode, depth: num(S.depth), engr: num(S.engrDepth), aePct: num(aePctOf(tool)) || undefined, aeMm: num(S.aeMm) || undefined,
    cornerR: CORNER_OPS.includes(S.op) && num(S.cornerR) > 0 ? num(S.cornerR) : undefined,
    boreD: S.op === 'bore' && num(S.boreD) > 0 ? num(S.boreD) : undefined, preD: S.op === 'bore' && num(S.preD) > 0 ? num(S.preD) : undefined,
    calc: { n: lastCalc.n, F: lastCalc.F, Fz: lastCalc.Fz, ap: lastCalc.ap, ae: lastCalc.ae },
    used: run, rate: rate || '', sym: sym && sym.length ? sym : undefined, note: String(note || '').trim().slice(0, 500) };
  for (const k of Object.keys(h.calc)) if (!Number.isFinite(h.calc[k])) delete h.calc[k];
  return h;
}

// Банери над результатом: виправлення за минулим досвідом, ресурс фрези, невписаний виліт
function expBanners(r, tool, mat, mach, hs) {
  let out = '';
